map $http_accept $oan_legacy_html { default 0; ~*text/html 1; }
map $host $oan_legacy_object_api { default 0; minio-farmer-development.oanstaging.com 1; }
map "$request_method:$oan_legacy_html:$oan_legacy_object_api" $oan_legacy_navigation { default 0; "GET:1:0" 1; "HEAD:1:0" 1; }
server {
    listen 80;
    server_name agent-iam-development.oanstaging.com auditmanager-development.oanstaging.com awe-development.oanstaging.com connector-cropsown-registry-development.oanstaging.com connector-farmer-registry-development.oanstaging.com connector-livestock-registry-development.oanstaging.com consent-manager-development.oanstaging.com consent-manager-partner-development.oanstaging.com crop-registry-development.oanstaging.com esignet-development.oanstaging.com farmer-registry-development.oanstaging.com iam-staff-ui-development.oanstaging.com idgenerator-farmer-development.oanstaging.com idgenerator-livestock-development.oanstaging.com kafka-development.oanstaging.com keycloak-crop-development.oanstaging.com keycloak-development.oanstaging.com keycloak-livestock-development.oanstaging.com livestock-registry-development.oanstaging.com master-data-development.oanstaging.com master-data-ui-development.oanstaging.com minio-console-development.oanstaging.com minio-farmer-development.oanstaging.com oan-dashboard-development.oanstaging.com odk-central-development.oanstaging.com partner-crop-development.oanstaging.com partner-farmer-development.oanstaging.com partner-livestock-development.oanstaging.com partner-management-development.oanstaging.com partner-management-partner-api-development.oanstaging.com staff-crop-development.oanstaging.com staff-farmer-development.oanstaging.com staff-iam-crop-development.oanstaging.com staff-iam-development.oanstaging.com staff-iam-livestock-development.oanstaging.com staff-livestock-development.oanstaging.com staff-portal-development.oanstaging.com;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name connector-cropsown-registry-development.oanstaging.com connector-farmer-registry-development.oanstaging.com connector-livestock-registry-development.oanstaging.com consent-manager-development.oanstaging.com crop-registry-development.oanstaging.com farmer-registry-development.oanstaging.com keycloak-crop-development.oanstaging.com keycloak-development.oanstaging.com keycloak-livestock-development.oanstaging.com livestock-registry-development.oanstaging.com minio-farmer-development.oanstaging.com oan-dashboard-development.oanstaging.com odk-central-development.oanstaging.com partner-farmer-development.oanstaging.com partner-management-development.oanstaging.com staff-crop-development.oanstaging.com staff-farmer-development.oanstaging.com staff-iam-crop-development.oanstaging.com staff-iam-development.oanstaging.com staff-iam-livestock-development.oanstaging.com;
    ssl_certificate /etc/openg2p/certs/development.oanstaging.com/fullchain.pem;
    ssl_certificate_key /etc/openg2p/certs/development.oanstaging.com/privkey.pem;
    client_max_body_size 100m;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_buffering on;
    proxy_buffers 8 16k;
    proxy_buffer_size 16k;
    proxy_busy_buffers_size 32k;
    if ($oan_legacy_navigation) { return 307 https://$oan_legacy_canonical$request_uri; }
    location / {
        proxy_pass http://istio_ingress;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $oan_connection_upgrade;
    }
}
