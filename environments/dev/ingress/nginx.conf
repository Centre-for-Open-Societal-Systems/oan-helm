# Install once on the dev reverse proxy after certificate issuance.
# The existing istio_ingress upstream targets 10.0.1.58:30080.
map $http_upgrade $oan_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name development.oanstaging.com *.development.oanstaging.com;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name development.oanstaging.com *.development.oanstaging.com;
    ssl_certificate /etc/openg2p/certs/development-wildcard.oanstaging.com/fullchain.pem;
    ssl_certificate_key /etc/openg2p/certs/development-wildcard.oanstaging.com/privkey.pem;
    client_max_body_size 100m;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    location / {
        proxy_pass http://istio_ingress;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $oan_connection_upgrade;
    }
}
