# APISIX on the oan_dev k3s node as the edge for the whole development environment. Development only.
#
#   *.development.oanstaging.com -> APISIX (this node, ports 80/443, wildcard certificate below)
#     ├─ hosts APISIX serves itself: their own ApisixRoutes and Ingresses (app charts, UIs)
#     └─ every other host (registries, keycloak, ...) -> catch-all route below -> OpenG2P istio
#
# The catch-all replaces the OpenG2P nginx in front of istio (environments/dev/ingress/nginx.conf), with the same
# upstream, headers, body size and timeouts. Istio's Gateway (environments/dev/ingress/gateway.yaml) accepts
# plain HTTP for *.development.oanstaging.com on node port 30080, so no second TLS hop is needed.
#
# Certificate: Secret oan-development-wildcard-tls in api6-gateway, issued and renewed on the node by
# automation/oan-dev/oan-k8s-tls.sh in the openg2p-deployment fork (acme.sh, DNS-01 on Route 53). The app gateway
# charts then leave tls.secretName unset.
#
#   kubectl apply -f environments/dev/manifests/apisix-edge.yaml
#
# Test before Route 53 points at this node, from anywhere that reaches it:
#   curl --resolve grievance-service.development.oanstaging.com:443:<node IP> https://grievance-service.development.oanstaging.com/v1/...
#   curl --resolve keycloak.development.oanstaging.com:443:<node IP> https://keycloak.development.oanstaging.com/
apiVersion: apisix.apache.org/v2
kind: ApisixTls
metadata:
  name: oan-development-wildcard
  namespace: api6-gateway
spec:
  ingressClassName: apisix
  hosts:
    - development.oanstaging.com
    - "*.development.oanstaging.com"
  secret:
    name: oan-development-wildcard-tls
    namespace: api6-gateway
---
# The OpenG2P istio ingress gateway, as nginx's `upstream istio_ingress`.
apiVersion: apisix.apache.org/v2
kind: ApisixUpstream
metadata:
  name: openg2p-istio
  namespace: api6-gateway
spec:
  ingressClassName: apisix
  externalNodes:
    - type: Domain
      name: 10.0.1.58
      port: 30080
  scheme: http
  # Istio routes on the client's Host.
  passHost: pass
  timeout:
    connect: 60s
    send: 300s
    read: 300s
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: openg2p-catch-all
  namespace: api6-gateway
spec:
  ingressClassName: apisix
  http:
    - name: openg2p-catch-all
      # Lowest priority: any route an app or UI declares for the same path wins.
      priority: -100
      match:
        hosts:
          - development.oanstaging.com
          - "*.development.oanstaging.com"
        paths:
          - /*
        # Hosts APISIX serves itself never fall through to OpenG2P, so a path they do not declare is a 404 here
        # instead of an istio 404. Add each new OAN host.
        exprs:
          - subject:
              scope: Variable
              name: host
            op: NotIn
            set:
              - grievance-service.development.oanstaging.com
              - grievance.development.oanstaging.com
              - a2c-service.development.oanstaging.com
              - a2c.development.oanstaging.com
              - sandbox.development.oanstaging.com
      websocket: true
      upstreams:
        - name: openg2p-istio
      plugins:
        # nginx allowed 100 MB (client_max_body_size).
        - name: client-control
          enable: true
          config:
            max_body_size: 104857600
