# Values for the oan-auth-gateway chart (oan_auth_service/apisix/k8s).
# Target: the grievance RKE2 node (13.233.56.204), not the OpenG2P cluster that `server`
# in ../endpoints.yaml names. oan_auth_service runs inside the grievance Frappe bench, so
# these match oan-grievance-gateway.yaml. Install in namespace `develop`.

ingressClassName: apisix

hosts:
  - grievance-backend-dev.oanstaging.com

siteName: develop.grievance.test

# Required: the grievance Frappe web Service in `develop`, unconfirmed (same as
# web.serviceName in oan-grievance-gateway.yaml).
web:
  serviceName: ""
  port: 8000

# Required: the same Redis as oan-grievance-gateway.yaml.
redis:
  host: ""

# Localhost only until the grievance UI host is confirmed.
corsOriginRegexes:
  - https?://localhost(:[0-9]+)?
