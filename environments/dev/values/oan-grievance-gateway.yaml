# Values for the oan-grievance-gateway chart (oan_grievance_service/apisix/k8s).
# Target: the gateway cluster, namespace `grievance`. Not the OpenG2P cluster that
# `server` in ../endpoints.yaml names. The same file runs a local single-node cluster
# (docs/grievance-service.md, "Local cluster").
# The routes reach Frappe in the grievance app cluster through its node ports
# (gatewayAccess in oan-grievance-service.yaml). See docs/apisix-gateway.md.
#
# Set at install, not here:
# - web.externalHosts and socket.externalHosts: the private addresses of the grievance
#   app nodes, from the gateway cluster's network. One entry per node; APISIX balances
#   across them and drops a node that fails its health check. Adding a node is an edit
#   to these lists and a `helm upgrade` of this release.

ingressClassName: apisix

# Namespace of the APISIX release, which owns the consumers shared by several apps
# (the IVR vendor). Routes whitelist them as `<this>_<name>`.
sharedConsumerNamespace: api6-gateway

hosts:
  - grievance-backend.development.oanstaging.com

# No `tls`: in dev APISIX terminates TLS for every *.development.oanstaging.com host with one wildcard
# (environments/dev/manifests/apisix-edge.yaml), so this chart creates no ApisixTls.

# Frappe site name (Jenkinsfile `targets.develop.site`), sent as Host because Frappe
# selects the site from it. Must equal siteName in oan-grievance-service.yaml.
siteName: grievance-backend.development.oanstaging.com

# With externalHosts set, serviceName only names the ApisixUpstream, and port is the node
# port of oan-grievance-service.yaml gatewayAccess. Without it, serviceName and port are a
# Service in this namespace (APISIX and Frappe in one cluster).
web:
  serviceName: grievance-frappe-gunicorn
  externalHosts: []
  port: 30800
  # Probe each node's port through the Service. Without this, APISIX keeps sending
  # requests to a node that is down. `host` is the Frappe site name.
  healthCheck:
    active:
      type: http
      httpPath: /api/method/ping
      host: grievance-backend.development.oanstaging.com
      timeout: 3
      healthy:
        interval: 5s
        successes: 2
        httpCodes: [200]
      unhealthy:
        interval: 5s
        httpFailures: 3
        tcpFailures: 3
        timeout: 3
        httpCodes: [500, 502, 503, 504]
socket:
  serviceName: grievance-frappe-socketio
  externalHosts: []
  port: 30900
  # socket.io has no ping route: check that the port accepts connections.
  healthCheck:
    active:
      type: tcp
      timeout: 3
      healthy:
        interval: 5s
        successes: 2
      unhealthy:
        interval: 5s
        tcpFailures: 3
        timeout: 3


# Browser origins allowed to open a socket.io connection with a session cookie, and
# regexes of origins the cors plugin allows. Localhost only until the grievance UI host
# is confirmed.
realtimeAllowedOrigins:
  - http://localhost:3000
corsOriginRegexes:
  - https?://localhost(:[0-9]+)?
