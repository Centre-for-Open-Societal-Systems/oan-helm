# Values for the oan-grievance-gateway chart (oan_grievance_service/apisix/k8s).
# Target: the grievance RKE2 node (13.233.56.204), not the OpenG2P cluster that `server`
# in ../endpoints.yaml names.
# Install in namespace `develop`, next to the grievance Frappe Services, so each
# ApisixRoute backend resolves there. See docs/apisix-gateway.md.

ingressClassName: apisix

hosts:
  - grievance-backend-dev.oanstaging.com

# Frappe site name (Jenkinsfile `targets.develop.site`), sent as Host because Frappe
# selects the site from it.
siteName: develop.grievance.test

# Required: Service names in namespace `develop`, unconfirmed. The Frappe Deployment is
# `backend`; point both at the frappe nginx Service instead if routing through it.
web:
  serviceName: ""
  port: 8000
socket:
  serviceName: ""
  port: 9000

# Required: a Redis in the grievance cluster for limit-count counters. The OpenG2P Commons
# Redis is in another cluster and is not reachable from here.
redis:
  host: ""

# Browser origins allowed to open a socket.io connection with a session cookie, and
# regexes of origins the cors plugin allows. Localhost only until the grievance UI host
# is confirmed.
realtimeAllowedOrigins:
  - http://localhost:3000
corsOriginRegexes:
  - https?://localhost(:[0-9]+)?
