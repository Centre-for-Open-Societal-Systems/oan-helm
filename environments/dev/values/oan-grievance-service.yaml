# Values for the oan-grievance-service chart (charts/oan-grievance-service).
# Target: the grievance app cluster (RKE2 node 13.233.56.204), not the OpenG2P cluster
# that `server` in ../endpoints.yaml names. The same file runs a local single-node cluster
# (docs/grievance-service.md, "Local cluster").
# Release `grievance`, namespace `develop`.
#
# Set at install, not here:
# - frappe.image.tag: the Jenkins tag `develop-<build>-<sha>` (locally: `develop`)
# - frappe.dbHost: set below, the shared PostgreSQL of the oan-frappe-common release (namespace frappe-common)

frappe:
  image:
    # Jenkinsfile IMAGE_REGISTRY/IMAGE_NAME. A local build tagged with this name is used
    # without a pull (pullPolicy IfNotPresent).
    repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/oan-frappe

  dbHost: oan-frappe-common-db-postgresql-subchart.frappe-common.svc.cluster.local
  dbRootUser: postgres

  persistence:
    worker:
      # ReadWriteMany from the NFS server, see nfs-csi.yaml.
      storageClass: nfs-csi

  siteConfig:
    values:
      host_name: https://grievance-backend.development.oanstaging.com
    # Demo data. Build and push from oan-service-helm: seed/Dockerfile with SERVICE=grievance.
    seed:
      enabled: true
      image:
        repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/oan/grievance-seed
        tag: demo-20261108

  # The central APISIX gateway runs in another cluster and reaches gunicorn and socket.io on
  # these node ports (web.port and socket.port in oan-grievance-gateway.yaml). Allow them in
  # the node's security group from the gateway cluster's addresses only.
  gatewayAccess:
    enabled: true
    web:
      nodePort: 30800
    socket:
      enabled: true
      nodePort: 30900

  jobs:
    configure:
      # nfs-csi creates each volume directory with mode 0777 (mountPermissions), so the
      # Frappe user can write it. The upstream root `chown -R` only races with Pods that
      # write into sites/ while the jobs run, and its failure fails the job.
      fixVolume: false
    createSite:
      siteName: grievance-backend.development.oanstaging.com
