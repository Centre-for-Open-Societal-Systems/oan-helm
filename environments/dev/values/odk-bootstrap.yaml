# New Dev: ODK Central in Commons (addons/odk-bootstrap). Each registry gets one project app user for test submissions,
# "OAN test submitter", with access to the registry's published forms; its token is kept in the Secret named here
# (namespace commons). No app user, role or QR code is made by hand.
central:
  publicUrl: https://odk-central.development.oanstaging.com

bootstrapAccount: oan-bootstrap@odk-central.development.oanstaging.com

registries:
  - name: farmer
    project: Farmer Registry
    forms: [farmer_profile]
    secretName: odk-test-submitter-farmer
  - name: crop
    project: Crop Sown Registry
    forms: [crop_sown_registry_plan, crop_sown_registry_prep, crop_sown_registry_sown, crop_sown_registry_harvest]
    secretName: odk-test-submitter-crop
  - name: livestock
    project: Gen2 Livestock Registry
    forms: [livestock_registry]
    secretName: odk-test-submitter-livestock
