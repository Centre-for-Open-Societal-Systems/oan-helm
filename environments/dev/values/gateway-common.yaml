# Values shared by every route chart on the dev APISIX: oan-grievance-gateway,
# oan-a2c-gateway and oan-partner-gateway. Pass it first, before the app's own file:
#   -f environments/dev/values/gateway-common.yaml -f environments/dev/values/oan-<app>-gateway.yaml
# Target: the gateway cluster, namespace `apisix`. See docs/apisix-gateway.md.

# Limit-count counters, in the gateway cluster (redis-gateway.yaml). Service
# apisix-redis-master.apisix.svc.cluster.local of the release `apisix-redis`; no password.
redis:
  host: apisix-redis-master.apisix.svc.cluster.local
  port: 6379
