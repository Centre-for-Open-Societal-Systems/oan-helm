# OAN Sandbox (charts/oan-sandbox) in the dev environment.
# Release `sandbox` in namespace `sandbox` (planned; not yet installed).
# Merge with private values holding the images and the Secret name
# (examples/dev/sandbox.yaml lists the steps and the Secret keys).
global:
  hostname: sandbox.development.oanstaging.com
config:
  appEnv: sandbox
  debug: false
  db:
    host: commons-postgresql.commons.svc.cluster.local
    port: 5432
    name: sandbox_db_oan
    user: sandbox
  gateway:
    enabled: true
    # Dev APISIX (apisix.dashboard.oanstaging.com, ingress controller), partner routes of
    # chart oan-partner-gateway on the public host below.
    # TO CONFIRM (DevOps): the host name, its DNS record and TLS certificate.
    uatUrl: https://partner-api-dev.oanstaging.com
    sync:
      # oauth: only reads the routes (viewer key), writes nothing. TO CONFIRM (docs/apisix-gateway.md 8b): how
      # this cluster reaches the Admin API; this host admits only the IPs in its
      # ip-restriction whitelist, so add this cluster's egress IP.
      enabled: true
      type: apisix
      adminUrl: https://apisix-admin.oanstaging.com
      # Pull the routes on its own once a day (new routes arrive unpublished in the catalogue).
      autoPullHours: 24
    appSync:
      enabled: true
    # Partners call with an app access token (client credentials), not the API key.
    partnerAuth: oauth
    tokenHeader: X-Partner-Token
    # Scopes the oan-partner-gateway routes require (the same names as that chart's
    # values). Order of the move: docs/apisix-gateway.md section 8d.
    scopes:
      /consent-manager: oan:consent-manager-portal
      /consent-manager-partner: oan:consent-manager-partner
      /partner-management-keys: oan:partner-management-keys
      /aggregation-layer: oan:aggregation-layer
    tokenAudience: oan-partner-gateway
    # true until the partner gateway runs with legacyRouteIds: false (section 8d, step 5).
    legacyRouteClaim: true
    logIngest:
      enabled: false
    rateLimit:
      enabled: false
  keycloak:
    enabled: true
    url: https://keycloak.development.oanstaging.com
    publicUrl: https://keycloak.development.oanstaging.com
    # Set up on 2026-11-05 with setup_partner_realm.py: oan-partner-api,
    # oan-sandbox-provisioner, oan-sandbox-portal, attribute participant_uid.
    realm: partner
    participantAuth: keycloak
    # Sandbox apps' own realm. Empty = app clients stay in `realm` (as today). TO CONFIRM
    # (DevOps): run setup_app_realm.py on the dev Keycloak, add KEYCLOAK_APPS_ADMIN_CLIENT_SECRET
    # to the Secret, then set realm: partner-sandbox-app, install, Apps & Keys > Re-sync all,
    # and only then point the partner gateway's keycloak.issuer at it.
    apps:
      realm: ""
      adminClientId: oan-sandbox-app-provisioner
  # Consent Manager partner portal: off until the CM portal client is confirmed in the realm
  # (then: consent-partner-portal, and rerun setup_partner_realm.py with --portal-client-id).
  partnerPortal:
    clientId: ""
  partnerManagement:
    enabled: false
    # Dev's commons-services deploys PM chart 1.0.2 (release 1.0: a key is needed to onboard,
    # no policies). Set "develop" (or auto) once the new PM (G2P-5719) is installed.
    apiVersion: "1.0"
  # Data policies of API products: COSS keeps them in the Consent Manager today.
  # TO CONFIRM (DevOps): CM staff API URL as the sandbox reaches it, and a client with
  # CONSENT_MANAGER_ADMIN (Secret CM_ADMIN_CLIENT_SECRET); empty apiUrl = no policies filed.
  policies:
    backend: auto
    consentManager:
      apiUrl: ""
      tokenUrl: ""
virtualService:
  gateway: istio-system/development
