# URL migration for an existing commons-services release whose saved values
# still carry old literal hosts. Every key equals the chart default, so merging
# it over saved values restores the canonical development URLs.
global:
  baseDomain: development.oanstaging.com
  keycloakBaseUrl: https://keycloak.development.oanstaging.com
  keycloakInternalUrl: http://commons-keycloak.commons.svc.cluster.local:80
  keycloakExternalIssuerUrl: https://keycloak.development.oanstaging.com/realms/staff
  keycloakIssuerUrl: http://commons-keycloak.commons.svc.cluster.local:80/realms/staff
  iamHostname: staff-iam.development.oanstaging.com
  staffPortalApiHostname: staff-iam.development.oanstaging.com
  agentPortalApiHostname: agent-iam.development.oanstaging.com
  staffPortalHostname: staff-portal.development.oanstaging.com
  staffPortalCookieDomain: .development.oanstaging.com
  authCookieDomain: .development.oanstaging.com
  cookieDomain: .development.oanstaging.com
  iamUrl: https://staff-iam.development.oanstaging.com
  iamServiceUrl: http://commons-services-iam-staff-portal-api.commons.svc.cluster.local
  # Tile URL (see the chart's values.yaml); the API keeps master-data.*.
  masterDataHostname: master-data-ui.development.oanstaging.com
  masterDataUiHostname: master-data-ui.development.oanstaging.com
  masterDataApiUrl: http://commons-services-master-data-api.commons.svc.cluster.local
  aweHostname: awe.development.oanstaging.com
  aweBaseUrl: http://commons-services-awe.commons.svc.cluster.local
  odkHostname: odk-central.development.oanstaging.com
  supersetHostname: ''
  certifyHostname: ''
  agentPortalHostname: ''
superset:
  enabled: false
  istio:
    virtualservice:
      gateway: istio-system/development
openg2p-inji-certify:
  enabled: false
  istio:
    virtualservice:
      gateway: istio-system/development
master-data:
  global:
    masterDataHostname: master-data-ui.development.oanstaging.com
    masterDataUiHostname: master-data-ui.development.oanstaging.com
  # Load the ETH-OAN pack on every upgrade (an unchanged pack creates nothing;
  # a new or changed list is published at once: development only).
  geoSeed:
    objectStore:
      endpoint: http://commons-garage:3900
    enabled: true
    publishInitial: true
    autoPublish: true
    # Code lists only. New Dev's geography is the catalogue migrated on
    # 2026-10-27 (level ids level-region..., unit ids region-ET01...), which
    # farmer records and forms reference. The pack's geography uses other level
    # ids, so loading it fails on the unique level mnemonic and stops every
    # upgrade at this hook. Replacing the geography is the separate fresh
    # geography cutover, not a side effect of an upgrade.
    load:
      geo: false
      codelists: true
      samples: false
  masterDataUi:
    iamPublicUrl: https://staff-iam.development.oanstaging.com
    envVars:
      COOKIE_DOMAIN: .development.oanstaging.com
    istio:
      virtualservice:
        gateway: istio-system/development
  masterDataAPI:
    hostname: master-data.development.oanstaging.com
    istio:
      virtualservice:
        gateway: istio-system/development
    # Public catalogue (read-only GET /public/...): the registry dashboards read
    # the map boundaries and location units from it (MASTER_DATA_URL). In-cluster
    # only: no public host. It serves only geography an administrator has marked
    # public in Master Data, at its published versions.
    catalogue:
      # Boundary GeoJSON lives in the Commons object store (Garage; see objectStore at the end of this file).
      boundaryStore:
        endpoint: http://commons-garage:3900
      public:
        enabled: true
odk-central:
  # ODK answers a download of an uploaded blob with a 307 to a URL presigned for this host, so it must be the
  # public Garage host that browsers and ODK Collect reach (as for the registries), not commons-garage:3900.
  s3ServerUrl: https://garage.development.oanstaging.com
  # Garage's init Job creates bucket odk-central; the subchart default odk-central-blobs does not exist.
  s3BucketName: odk-central
  odk-central-enketo:
    initContainers:
    - name: wait-for-garage
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command:
      - sh
      - -c
      - "until nc -zv commons-garage 3900; do
  echo \"Waiting for Garage...\"
  sleep 2
done
"
  backend:
    envVars:
      OIDC_ISSUER_URL: https://keycloak.development.oanstaging.com/realms/staff
  istio:
    virtualservice:
      gateway: istio-system/development
esignet:
  hostname: esignet.development.oanstaging.com
  istio:
    virtualservice:
      gateway: istio-system/development
  oidcUi:
    istio:
      virtualservice:
        gateway: istio-system/development
mock-identity-system:
  hostname: esignet.development.oanstaging.com
  istio:
    virtualservice:
      gateway: istio-system/development
openg2p-iam-service:
  global:
    keycloakApplicationUrl: https://keycloak.development.oanstaging.com
    registryApplicationUrl: https://farmer-registry.development.oanstaging.com
    # Garage has no console (commons-base 2.3.4): an empty URL hides the tile.
    minioApplicationUrl: ''
    supersetApplicationUrl: ''
    iamStaffUiApplicationUrl: https://iam-staff-ui.development.oanstaging.com
    masterDataApplicationUrl: https://master-data-ui.development.oanstaging.com
    aweApplicationUrl: https://awe.development.oanstaging.com
    staffPortalDefaultRedirectUri: https://staff-portal.development.oanstaging.com
    agentPortalDefaultRedirectUri: ''
  iamStaffUi:
    hostname: iam-staff-ui.development.oanstaging.com
    envVars:
      COOKIE_DOMAIN: .development.oanstaging.com
      BACKEND_API_URL: https://staff-iam.development.oanstaging.com
    istio:
      virtualservice:
        gateway: istio-system/development
  iamStaffPortalApi:
    istio:
      virtualservice:
        gateway: istio-system/development
  iamAgentPortalApi:
    istio:
      virtualservice:
        gateway: istio-system/development
openg2p-staff-portal-ui:
  staffPortalUi:
    envVars:
      COOKIE_DOMAIN: .development.oanstaging.com
      IAM_URL: https://staff-iam.development.oanstaging.com
    istio:
      virtualservice:
        gateway: istio-system/development
openg2p-audit-manager:
  global:
    auditManagerHostname: auditmanager.development.oanstaging.com
  auditManager:
    istio:
      virtualservice:
        gateway: istio-system/development
partner-management:
  global:
    staffPortalUiHostname: partner-management.development.oanstaging.com
    partnerApiHostname: partner-management-partner-api.development.oanstaging.com
  staffPortalUi:
    envVars:
      IAM_URL: https://staff-iam.development.oanstaging.com
      KEYCLOAK_LOGOUT_URL: https://keycloak.development.oanstaging.com/realms/staff/protocol/openid-connect/logout
    istio:
      virtualservice:
        gateway: istio-system/development
  staffPortalApi:
    istio:
      virtualservice:
        gateway: istio-system/development
  partnerApi:
    istio:
      virtualservice:
        gateway: istio-system/development
openg2p-consent-manager:
  global:
    consentManagerHostname: consent-manager.development.oanstaging.com
    consentManagerPartnerHostname: consent-manager-partner.development.oanstaging.com
    consentManagerBeneHostname: ''
  consentManagerApi:
    envVars:
      # OTP test copy goes to bucket a2c-webhook on AWS S3 (ap-south-1). An empty endpoint URL
      # means AWS.
      # Keys: Secret consent-manager-otp-dev (minio-access-key and minio-secret-key hold the
      # AWS IAM user's keys). See docs/consent-otp-delivery.md before changing this.
      CONSENT_MANAGER_OTP_PUBLISH_ENDPOINT_URL: ''
      CONSENT_MANAGER_OTP_PUBLISH_REGION: ap-south-1
      # The consent OTP is sent by SMS straight to the 8028 gateway; the bucket copy above is
      # then not written (a sent code is not also published). Secret consent-sms8028 holds the
      # credentials; the test number is in Secret consent-manager-otp-dev, key oan-phone-map.
      # Switch to 'false' to fall back to the bucket copy.
      CONSENT_MANAGER_SMS8028_ENABLED: 'true'
      CONSENT_MANAGER_AWE_CALLBACK_URL: http://{{ .Release.Name }}-cm-api.{{ .Release.Namespace }}.svc.cluster.local/consent/v1/awe/webhooks/decision
    istio:
      virtualservice:
        gateway: istio-system/development
    image:
      pullPolicy: Always
      repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/eoan/consent-management/consent-manager-api-1.0.2
      tag: 0.0.0-develop.7@sha256:87fda6df8a2597d670b9a13ac48b46b9112b50b72b25f24b4eb6ff17e705fd7e
  ui:
    istio:
      virtualservice:
        gateway: istio-system/development
    image:
      pullPolicy: Always
      repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/eoan/consent-management/consent-manager-ui-1.0.2
      tag: 0.0.0-develop.7@sha256:496b23ccbdafcc6667cc891c36af45006fd6ccb5ded5cd2af03faaf39f77f50b
  extraApis:
    - apiAudience: partner
      authEnabled: 'false'
      enabled: true
      hostname: '{{ tpl .Values.global.consentManagerPartnerHostname $ }}'
      image:
        pullPolicy: Always
        registry: ''
        repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/eoan/consent-management/consent-manager-api-1.0.2
        tag: 0.0.0-develop.7@sha256:87fda6df8a2597d670b9a13ac48b46b9112b50b72b25f24b4eb6ff17e705fd7e
      istio:
        enabled: true
        gateway:
          enabled: false
        virtualservice:
          destination: '{{ .Release.Name }}-cm-partner-api'
          destinationPort: 80
          enabled: true
          gateway: istio-system/development
          host: '{{ tpl .Values.global.consentManagerPartnerHostname $ }}'
          prefix: /api/consent-manager-partner/
          rewriteUri: /
      nameOverride: cm-partner-api
      openapiRootPath: /api/consent-manager-partner
      signingKeyMounted: true
    - apiAudience: beneficiary
      authEnabled: 'true'
      enabled: false
      hostname: '{{ tpl .Values.global.consentManagerBeneHostname $ }}'
      istio:
        enabled: true
        gateway:
          enabled: false
        virtualservice:
          destination: '{{ .Release.Name }}-cm-bene-api'
          destinationPort: 80
          enabled: true
          gateway: istio-system/development
          host: '{{ tpl .Values.global.consentManagerBeneHostname $ }}'
          prefix: /api/consent-manager-bene/
          rewriteUri: /
      nameOverride: cm-bene-api
      openapiRootPath: /api/consent-manager-bene
      signingKeyMounted: false
  sanity:
    image:
      pullPolicy: Always
      repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/eoan/consent-management/consent-manager-sanity-1.0.2
      tag: 0.0.0-develop.7@sha256:abb3307a1e15bbb53fe8328a3724eda6b2644663b5fe0cabf21be982a15970d7
keymanager:
  istio:
    virtualservice:
      gateway: istio-system/development
openg2p-awe:
  istio:
    virtualservice:
      gateway: istio-system/development

# IAM beneficiary portal API (image 1.1.0). Live on New Dev since 2026-10-30,
# applied on its own from this chart's template; enabling it here lets the next
# commons-services upgrade adopt the running resources instead of dropping them.
# Login provider seeding stays off until a Fayda/eSignet client and signing key exist.
iamBenePortalApi:
  enabled: true
  virtualService:
    enabled: true
    host: bene-iam.development.oanstaging.com
    gateway: istio-system/development
  loginProvider:
    seed: false
    defaultRedirectUri: https://bene-portal.development.oanstaging.com

# The Aggregation API's staff search role (chart templates/aggregation-staff-grant.yaml). These are the
# two users granted it by hand on 21 October (docs/rancher-consent-aggregation-status.md); from the
# commons-services chart that has the Job on, Helm keeps the grant instead.
aggregationStaffGrant:
  users: [admin, nina.patel]
consentPartnerPortal:
  enabled: true
  image:
    digest: sha256:4e8d7be0391ddb5c9d688bdff994053cf0f6d1e5ef4348727df646fa64ff8116
    repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/eoan/consent-management/consent-manager-partner-portal-1.0.2
# Commons object store: Garage replaced MinIO (base chart 2.3.4, environments/dev/commons-base.chart). The public S3 host
# keeps its old name, so registries and presigned URLs are unchanged; it now routes to Garage.
objectStore:
  enabled: true
  route:
    enabled: true
    hosts:
    - minio-farmer.development.oanstaging.com
    gateway: istio-system/development
  credentialsSync:
    enabled: true
    namespaces: [farmer, crop, livestock, da-registry]
  # One-off MinIO to Garage copy for the 20 Nov 2026 cutover. Switch off (and delete the finished Job) after sign-off.
  # Services that still address the old name (ODK's wait-for-minio, Crop's partner API) keep working.
  compatService:
    enabled: true
  restore:
    enabled: true
