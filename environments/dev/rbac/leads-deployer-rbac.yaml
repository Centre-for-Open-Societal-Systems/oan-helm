# Leads cluster (node 10.0.1.131): the deployer of the leads-api release (leads-api + telephony subchart, namespace leads), used only by the
# leads-api Jenkinsfile stage 'Deploy (Helm → leads namespace)' (Centre-for-Open-Societal-Systems/leads-api,
# ci/deploy-leads-helm.sh) through the Jenkins kubeconfig credential dev-leads-deployer-kubeconfig. Modelled on
# commons-deployer-rbac.yaml. Rights in leads only, and only on the object kinds the release owns: no cluster-scoped
# rights, nothing in any other namespace.
#
# What it can read, plainly: EVERY Secret in leads (the database and ESL passwords, the ECR pull secret). This cannot
# be narrowed: Helm stores each release revision as a Secret in the release namespace, and the chart owns its own
# Secrets. Because it can also create Roles and RoleBindings in leads (the chart's ECR-refresh Job owns some), it is in
# effect an administrator of the leads namespace; Kubernetes still refuses a Role or RoleBinding granting more than this
# Role holds (escalation check), so it cannot reach outside leads. Keep the kubeconfig only in that one Jenkins
# credential.
#
# The Namespace is created here, because the deployer has no cluster-scoped rights (the Helm stage does not use
# --create-namespace).
#
# Apply once as the cluster admin on the leads node 10.0.1.131 (safe to re-apply; RKE2 paths, else use that cluster's admin kubeconfig):
#   sudo /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml apply -f leads-deployer-rbac.yaml
# Check:
#   K="sudo /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml"
#   $K auth can-i patch deployments -n leads --as=system:serviceaccount:leads:leads-deployer       # yes
#   $K auth can-i list secrets -n commons --as=system:serviceaccount:leads:leads-deployer         # no
#   $K auth can-i create clusterroles --as=system:serviceaccount:leads:leads-deployer             # no
# Then build the kubeconfig and upload it as Jenkins credential dev-leads-deployer-kubeconfig (Secret file); the token
# is written to a 0600 file and never printed. The API server address is the leads node's private address (10.0.1.131), which
# the oan-ci-deploy agent must reach on port 6443. Delete the file after the upload:
#   umask 077; T=$($K -n leads get secret leads-deployer-token -o jsonpath='{.data.token}' | base64 -d)
#   CA=$(sudo grep certificate-authority-data /etc/rancher/rke2/rke2.yaml | awk '{print $2}')
#   printf 'apiVersion: v1\nkind: Config\nclusters:\n- name: leads-dev\n  cluster:\n    server: https://10.0.1.131:6443\n    certificate-authority-data: %s\nusers:\n- name: leads-deployer\n  user:\n    token: %s\ncontexts:\n- name: leads-deployer\n  context: {cluster: leads-dev, user: leads-deployer, namespace: leads}\ncurrent-context: leads-deployer\n' "$CA" "$T" > ~/leads-deployer.kubeconfig; unset T
apiVersion: v1
kind: Namespace
metadata:
  name: leads
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: leads-deployer
  namespace: leads
---
apiVersion: v1
kind: Secret
metadata:
  name: leads-deployer-token
  namespace: leads
  annotations:
    kubernetes.io/service-account.name: leads-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: leads-deployer
  namespace: leads
rules:
  # Helm release storage, the chart's own Secrets/ConfigMaps, and the remaining core kinds.
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "services", "serviceaccounts", "persistentvolumeclaims", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # --wait and --atomic read events and pod logs only through these.
  - apiGroups: [""]
    resources: ["events", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  # The ECR pull-secret hook Job and its refresh CronJob.
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # externalDb with a fixed IP (Service + EndpointSlice).
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The chart's ECR-refresh Roles/RoleBindings.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: leads-deployer
  namespace: leads
subjects:
  - kind: ServiceAccount
    name: leads-deployer
    namespace: leads
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: leads-deployer
