# Lets the commons-services object-store credentials Job (ServiceAccount commons-services-object-store-credentials in
# namespace commons) write Secret commons-minio in each registry namespace. Apply once, with cluster-admin:
#   kubectl apply -f environments/dev/rbac/object-store-credentials-rbac.yaml
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: commons-services-object-store-credentials
  namespace: farmer
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["commons-minio"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: commons-services-object-store-credentials
  namespace: farmer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: commons-services-object-store-credentials
subjects:
- kind: ServiceAccount
  name: commons-services-object-store-credentials
  namespace: commons
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: commons-services-object-store-credentials
  namespace: crop
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["commons-minio"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: commons-services-object-store-credentials
  namespace: crop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: commons-services-object-store-credentials
subjects:
- kind: ServiceAccount
  name: commons-services-object-store-credentials
  namespace: commons
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: commons-services-object-store-credentials
  namespace: livestock
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["commons-minio"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: commons-services-object-store-credentials
  namespace: livestock
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: commons-services-object-store-credentials
subjects:
- kind: ServiceAccount
  name: commons-services-object-store-credentials
  namespace: commons
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: commons-services-object-store-credentials
  namespace: da-registry
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["commons-minio"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: commons-services-object-store-credentials
  namespace: da-registry
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: commons-services-object-store-credentials
subjects:
- kind: ServiceAccount
  name: commons-services-object-store-credentials
  namespace: commons
