# staging: installed on the staging reverse proxy as /etc/nginx/sites-enabled/openg2p-qa-oanstaging.conf.
# Certificate: Let's Encrypt HTTP-01 through the certbot nginx plugin, one certificate naming every host in
# certificate-names.txt (DNS for *.qa.oanstaging.com already points here, so no Route 53 credentials are needed):
#   sudo certbot certonly --nginx --non-interactive --agree-tos --key-type ecdsa --expand #     --cert-name qa.oanstaging.com $(grep -v '^#' certificate-names.txt | sed 's/^/-d /')
# certbot.timer renews it. A host that is not listed gets a TLS error until it is added and the command is re-run.
# Keep the exact-name server blocks that serve jenkins, rancher and other existing hosts; they win over this wildcard.
# The per-host *.oanstaging.com sites and certificates stay in place until the move is verified (rollback).
map $http_upgrade $oan_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name qa.oanstaging.com *.qa.oanstaging.com;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name qa.oanstaging.com *.qa.oanstaging.com;
    ssl_certificate /etc/letsencrypt/live/qa.oanstaging.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qa.oanstaging.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    client_max_body_size 100m;
    # Stream uploads (MinIO, ODK, connector) to the ingress, as the per-host sites did.
    proxy_request_buffering off;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    # Preserve the previous ingress buffers for OIDC cookies/response headers.
    proxy_buffering on;
    proxy_buffers 8 16k;
    proxy_buffer_size 16k;
    proxy_busy_buffers_size 32k;
    location / {
        proxy_pass http://istio_ingress;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $oan_connection_upgrade;
    }
}
