# staging: confirm. Install on the staging reverse proxy after the wildcard certificate for *.oanstaging.com exists.
# Keep the exact-name server blocks that serve jenkins, rancher and other existing hosts; they win over this wildcard.
map $http_upgrade $oan_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name oanstaging.com *.oanstaging.com;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name oanstaging.com *.oanstaging.com;
    ssl_certificate /etc/openg2p/certs/wildcard.oanstaging.com/fullchain.pem;
    ssl_certificate_key /etc/openg2p/certs/wildcard.oanstaging.com/privkey.pem;
    client_max_body_size 100m;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    # Preserve the previous ingress buffers for OIDC cookies/response headers.
    proxy_buffering on;
    proxy_buffers 8 16k;
    proxy_buffer_size 16k;
    proxy_busy_buffers_size 32k;
    location / {
        proxy_pass http://istio_ingress;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $oan_connection_upgrade;
    }
}
