# Staging Gateway. Environment-owned, installed once on the rebuilt Commons cluster.
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: staging
  namespace: istio-system
  labels:
    app.kubernetes.io/part-of: oan-staging-ingress
    app.kubernetes.io/managed-by: oan-environment-operations
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 8080
        name: staging-http
        protocol: HTTP
      hosts:
        # Staging's own scope since the move off .oanstaging.com: its cookies (.qa.oanstaging.com) no longer
        # cover New Dev's *.development.oanstaging.com.
        - '*.qa.oanstaging.com'
        # The previous names, kept for rollback until the move is verified (remove in the follow-up).
        - '*.oanstaging.com'
