# Staging Gateway. Environment-owned, installed once on the rebuilt Commons cluster.
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: staging
  namespace: istio-system
  labels:
    app.kubernetes.io/part-of: oan-staging-ingress
    app.kubernetes.io/managed-by: oan-environment-operations
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 8080
        name: staging-http
        protocol: HTTP
      hosts:
        - '*.oanstaging.com'
