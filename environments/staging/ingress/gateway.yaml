# Staging counterpart of the dev Gateway. Environment-owned, installed once on the rebuilt Commons cluster.
# staging: confirm the Gateway name and namespace; staging today uses commons/internal and public-oanstaging.
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: development  # staging: confirm (the name the staging values reference)
  namespace: istio-system
  labels:
    app.kubernetes.io/part-of: oan-staging-ingress
    app.kubernetes.io/managed-by: oan-environment-operations
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 8080
        name: staging-http
        protocol: HTTP
      hosts:
        - '*.oanstaging.com'
