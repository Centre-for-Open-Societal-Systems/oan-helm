# Staging overlay for the openg2p-commons-base release `commons`. Staging keeps its saved values, so apply it with
# --reuse-values. Only what must match New Dev is here.
global:
  # Staging's own cookie and host scope. The saved values hold baseDomain oanstaging.com, from which this chart
  # derives Keycloak's hostname (KC_HOSTNAME, so the issuer https://keycloak.<baseDomain>/realms/staff) and the
  # other Commons hosts; .oanstaging.com contained New Dev's .development.oanstaging.com.
  baseDomain: qa.oanstaging.com
  # Kafka UI signs in through the staff realm, so it needs a public host with a certificate (nginx on the box).
  kafkaUiHostname: kafka.qa.oanstaging.com
postgresql:
  primary:
    resources:
      limits:
        # New Dev runs Postgres without a memory limit. Staging's saved limit of 1Gi killed Postgres during dumps, and
        # Helm cannot clear a saved value with null on this chart, so the limit is set well above what Postgres uses.
        memory: 8Gi
kafka:
  controller:
    # Staging's saved values give the controller a 1Gi memory limit and an empty heapOpts, so Kafka starts with its
    # built-in 1 GB heap and the container is OOMKilled (542 restarts by 10 Nov 2026). New Dev runs without a limit.
    # As with Postgres, the saved limit cannot be cleared with null: set an explicit heap and a limit with room for
    # the JVM's off-heap memory.
    heapOpts: -Xmx1024m -Xms1024m
    resources:
      requests:
        memory: 1536Mi
      limits:
        memory: 3Gi
minio:
  istio:
    virtualservice:
      host: minio-console.qa.oanstaging.com
      apiHost: minio-farmer.qa.oanstaging.com
      gateway: istio-system/staging
kafkaUi:
  istio:
    virtualservice:
      # The public host only works through the staging gateway; the chart default is the internal one.
      gateway: istio-system/staging
