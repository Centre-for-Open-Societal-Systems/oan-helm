# Staging (qa.oanstaging.com) overlay for a freshly rebuilt Commons. It is the New Dev
# overlay with the base domain changed; everything the chart enables by default
# (ODK Central with Keycloak OIDC client openg2p-odk, consent manager and partner
# portal, aggregation API, WebSub hub, eSignet mock, keymanager) stays on, as on
# New Dev. Hosts that the chart derives from global.baseDomain (aggregation API,
# consent partner portal, registry connector Keycloak clients) need the chart
# release that carries that derivation.
# Lines marked "staging: confirm" are not yet decided for staging.
global:
  baseDomain: qa.oanstaging.com
  keycloakBaseUrl: https://keycloak.qa.oanstaging.com
  keycloakInternalUrl: http://commons-keycloak.commons.svc.cluster.local:80
  keycloakExternalIssuerUrl: https://keycloak.qa.oanstaging.com/realms/staff
  keycloakIssuerUrl: http://commons-keycloak.commons.svc.cluster.local:80/realms/staff
  iamHostname: staff-iam.qa.oanstaging.com
  staffPortalApiHostname: staff-iam.qa.oanstaging.com
  agentPortalApiHostname: agent-iam.qa.oanstaging.com
  staffPortalHostname: staff-portal.qa.oanstaging.com
  staffPortalCookieDomain: .qa.oanstaging.com
  authCookieDomain: .qa.oanstaging.com
  cookieDomain: .qa.oanstaging.com
  iamUrl: https://staff-iam.qa.oanstaging.com
  iamServiceUrl: http://commons-services-iam-staff-portal-api.commons.svc.cluster.local
  # Tile URL (see the chart's values.yaml); the API keeps master-data.*.
  masterDataHostname: master-data-ui.qa.oanstaging.com
  masterDataUiHostname: master-data-ui.qa.oanstaging.com
  masterDataApiUrl: http://commons-services-master-data-api.commons.svc.cluster.local
  aweHostname: awe.qa.oanstaging.com
  aweBaseUrl: http://commons-services-awe.commons.svc.cluster.local
  odkHostname: odk-central.qa.oanstaging.com
  supersetHostname: ''
  certifyHostname: ''
  agentPortalHostname: ''
superset:
  enabled: false
  istio:
    virtualservice:
      gateway: istio-system/staging
openg2p-inji-certify:
  enabled: false
  istio:
    virtualservice:
      gateway: istio-system/staging
master-data:
  global:
    masterDataHostname: master-data-ui.qa.oanstaging.com
    masterDataUiHostname: master-data-ui.qa.oanstaging.com
  # Staging Commons is upgraded in place, like New Dev: its master_data database holds the
  # legacy catalogue (4 levels, 21053 geography values), which Master Data migrates on
  # start. The ETH-OAN pack (chart default countryPack) adds the code lists and publishes
  # them at once. geo stays false: the pack's level ids differ from the migrated catalogue,
  # so loading it fails on the unique level mnemonic and stops the upgrade at this hook.
  # Set geo true only for a fresh Commons with an empty master_data database.
  # samples: the pack's sample people (g2p_sample_individuals/households), which the
  # registries' sample loaders read from Master Data /samples. Staging only; the chart
  # default stays false. The load is an upsert (a re-run changes nothing). The people
  # sit on the pack's P-codes (ET01010102 ...), so until staging's geography is the
  # pack's, the seed warns that they are not in g2p_geo_level_values.
  # 10 Nov 2026 geography cutover (ASMIT approved): the legacy master_data database is
  # renamed to master_data_archive_20261110 and an empty master_data is created, so this
  # upgrade is a first load of the ETH-OAN pack: geography on the pack's P-codes, code
  # lists and sample people, published at once. It ran on 11 Nov 2026 (commons-services
  # revision 19: 1 published version, 21,037 units). geo is false again so later upgrades
  # only upsert code lists and samples; the archive database stays as the record.
  # The image is the seed build with CROP_DISEASE (release record 1.0.0-dev.39); staging
  # pinned it while staging ran chart 1.0.0-dev.35, whose default seed image is older.
  geoSeed:
    enabled: true
    publishInitial: true
    autoPublish: true
    # Repository as well as tag: the release's saved values still name the old GHCR build,
    # which has no image with this digest.
    image:
      repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/openg2p/commons/master-data-db-seed
      tag: f929965ce2a9-mds-e569a59b@sha256:27520bf4706809a30a8aacdc5372e22310c81972dd04ba9d12a68d281c8b068a
    load:
      geo: false
      codelists: true
      samples: true
  masterDataUi:
    iamPublicUrl: https://staff-iam.qa.oanstaging.com
    envVars:
      COOKIE_DOMAIN: .qa.oanstaging.com
    istio:
      virtualservice:
        gateway: istio-system/staging
  masterDataAPI:
    hostname: master-data.qa.oanstaging.com
    istio:
      virtualservice:
        gateway: istio-system/staging
odk-central:
  backend:
    envVars:
      OIDC_ISSUER_URL: https://keycloak.qa.oanstaging.com/realms/staff
  istio:
    virtualservice:
      gateway: istio-system/staging
esignet:
  hostname: esignet.qa.oanstaging.com
  istio:
    virtualservice:
      gateway: istio-system/staging
  oidcUi:
    istio:
      virtualservice:
        gateway: istio-system/staging
mock-identity-system:
  hostname: esignet.qa.oanstaging.com
  istio:
    virtualservice:
      gateway: istio-system/staging
openg2p-iam-service:
  global:
    keycloakApplicationUrl: https://keycloak.qa.oanstaging.com
    registryApplicationUrl: https://farmer-registry.qa.oanstaging.com
    minioApplicationUrl: https://minio-console.qa.oanstaging.com
    supersetApplicationUrl: ''
    iamStaffUiApplicationUrl: https://iam-staff-ui.qa.oanstaging.com
    masterDataApplicationUrl: https://master-data-ui.qa.oanstaging.com
    aweApplicationUrl: https://awe.qa.oanstaging.com
    staffPortalDefaultRedirectUri: https://staff-portal.qa.oanstaging.com
    agentPortalDefaultRedirectUri: ''
  iamStaffUi:
    hostname: iam-staff-ui.qa.oanstaging.com
    envVars:
      COOKIE_DOMAIN: .qa.oanstaging.com
      BACKEND_API_URL: https://staff-iam.qa.oanstaging.com
    istio:
      virtualservice:
        gateway: istio-system/staging
  iamStaffPortalApi:
    istio:
      virtualservice:
        gateway: istio-system/staging
  iamAgentPortalApi:
    istio:
      virtualservice:
        gateway: istio-system/staging
openg2p-staff-portal-ui:
  staffPortalUi:
    envVars:
      COOKIE_DOMAIN: .qa.oanstaging.com
      IAM_URL: https://staff-iam.qa.oanstaging.com
    istio:
      virtualservice:
        gateway: istio-system/staging
openg2p-audit-manager:
  global:
    auditManagerHostname: auditmanager.qa.oanstaging.com
  auditManager:
    istio:
      virtualservice:
        gateway: istio-system/staging
partner-management:
  global:
    staffPortalUiHostname: partner-management.qa.oanstaging.com
    partnerApiHostname: partner-management-partner-api.qa.oanstaging.com
  staffPortalUi:
    envVars:
      IAM_URL: https://staff-iam.qa.oanstaging.com
      KEYCLOAK_LOGOUT_URL: https://keycloak.qa.oanstaging.com/realms/staff/protocol/openid-connect/logout
    istio:
      virtualservice:
        gateway: istio-system/staging
  staffPortalApi:
    istio:
      virtualservice:
        gateway: istio-system/staging
  partnerApi:
    istio:
      virtualservice:
        gateway: istio-system/staging
openg2p-consent-manager:
  # Equals the chart default; stated so a later default change cannot switch it off.
  enabled: true
  # extraApis is a list, so it is restated whole: only the gateway of cm-partner-api differs
  # from the chart default (istio-system/development does not exist on staging).
  extraApis:
  - enabled: true
    nameOverride: cm-partner-api
    apiAudience: partner
    authEnabled: 'false'
    signingKeyMounted: true
    hostname: '{{ tpl .Values.global.consentManagerPartnerHostname $ }}'
    openapiRootPath: /api/consent-manager-partner
    image:
      pullPolicy: Always
      registry: ''
      repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/openg2p/commons/consent-manager-api
      tag: dev-48e64c249056@sha256:cca3273868b8ed28d193642b346fc3369b450ad7feefd42d02e91e84cb074831
    istio:
      enabled: true
      virtualservice:
        enabled: true
        host: '{{ tpl .Values.global.consentManagerPartnerHostname $ }}'
        gateway: istio-system/staging
        destination: '{{ .Release.Name }}-cm-partner-api'
        destinationPort: 80
        prefix: /api/consent-manager-partner/
        rewriteUri: /
      gateway:
        enabled: false
  - enabled: false
    nameOverride: cm-bene-api
    apiAudience: beneficiary
    authEnabled: 'true'
    signingKeyMounted: false
    hostname: '{{ tpl .Values.global.consentManagerBeneHostname $ }}'
    openapiRootPath: /api/consent-manager-bene
    istio:
      enabled: true
      virtualservice:
        enabled: true
        host: '{{ tpl .Values.global.consentManagerBeneHostname $ }}'
        gateway: istio-system/staging
        destination: '{{ .Release.Name }}-cm-bene-api'
        destinationPort: 80
        prefix: /api/consent-manager-bene/
        rewriteUri: /
      gateway:
        enabled: false
  global:
    consentManagerHostname: consent-manager.qa.oanstaging.com
    consentManagerPartnerHostname: consent-manager-partner.qa.oanstaging.com
    consentManagerBeneHostname: ''
  consentManagerApi:
    envVars:
      CONSENT_MANAGER_AWE_CALLBACK_URL: http://{{ .Release.Name }}-cm-api.{{ .Release.Namespace }}.svc.cluster.local/consent/v1/awe/webhooks/decision
    istio:
      virtualservice:
        gateway: istio-system/staging
  ui:
    istio:
      virtualservice:
        gateway: istio-system/staging
keymanager:
  istio:
    virtualservice:
      gateway: istio-system/staging
openg2p-awe:
  istio:
    virtualservice:
      gateway: istio-system/staging
# Services the Farmer registry, ODK intake and enrichment need. These equal the chart
# defaults; they are stated so a later default change cannot switch them off on staging.
websub:
  enabled: true
websubTopicProvisioning:
  enabled: true
aggregationApi:
  enabled: true
  virtualService:
    gateway: istio-system/staging
consentPartnerPortal:
  enabled: true
  virtualService:
    gateway: istio-system/staging

# IAM beneficiary portal API, as on New Dev. Login provider seeding stays off until a
# Fayda/eSignet client and signing key exist.
iamBenePortalApi:
  enabled: true
  virtualService:
    enabled: true
    host: bene-iam.qa.oanstaging.com
    gateway: istio-system/staging
  loginProvider:
    seed: false
    defaultRedirectUri: https://bene-portal.qa.oanstaging.com

# Staff-realm public clients answer only on the qa hosts. prune: true replaces each listed
# client's redirect URIs and web origins with exactly the declared ones, so the old
# *.oanstaging.com, *.commons.staging.openg2p.test and *.commons.openg2p.org entries go.
# registry-connector-ui comes from keycloak-init (connector-*.{{ baseDomain }}); the rest are
# created by subcharts and are declared here.
keycloakPublicClientUrls:
  prune: true
  extraClients:
  - realm: staff
    clientId: consent-manager-ui
    redirectUris:
    - 'https://{{ tpl (index .Values "openg2p-consent-manager" "global" "consentManagerHostname") $ }}/*'
    webOrigins:
    - 'https://{{ tpl (index .Values "openg2p-consent-manager" "global" "consentManagerHostname") $ }}'
  - realm: staff
    clientId: awe-admin-portal
    redirectUris:
    - 'https://{{ .Values.global.aweHostname }}/*'
    webOrigins:
    - 'https://{{ .Values.global.aweHostname }}'
  - realm: staff
    clientId: iam-staff-ui
    redirectUris:
    - 'https://iam-staff-ui.{{ .Values.global.baseDomain }}/*'
    webOrigins:
    - 'https://iam-staff-ui.{{ .Values.global.baseDomain }}'
