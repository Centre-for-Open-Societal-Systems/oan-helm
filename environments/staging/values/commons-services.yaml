openg2p-consent-manager:
  # Equals the chart default; stated so a later default change cannot switch it off.
  enabled: true
  # extraApis is a list, so it is restated whole: only the gateway of cm-partner-api differs
  # from the chart default (istio-system/development does not exist on staging).
  extraApis:
  - enabled: true
    nameOverride: cm-partner-api
    apiAudience: partner
    authEnabled: 'false'
    signingKeyMounted: true
    hostname: '{{ tpl .Values.global.consentManagerPartnerHostname $ }}'
    openapiRootPath: /api/consent-manager-partner
    image:
      pullPolicy: Always
      registry: ''
      repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/eoan/consent-manager/consent-manager-api
      tag: 1.1.0-develop.1@sha256:12fe280e3faed5dc497f0ffcaad747ea73b7b16593e009693b6034c87431d075
    istio:
      enabled: true
      virtualservice:
        enabled: true
        host: '{{ tpl .Values.global.consentManagerPartnerHostname $ }}'
        gateway: istio-system/staging
        destination: '{{ .Release.Name }}-cm-partner-api'
        destinationPort: 80
        prefix: /api/consent-manager-partner/
        rewriteUri: /
      gateway:
        enabled: false
  - enabled: false
    nameOverride: cm-bene-api
    apiAudience: beneficiary
    authEnabled: 'true'
    signingKeyMounted: false
    hostname: '{{ tpl .Values.global.consentManagerBeneHostname $ }}'
    openapiRootPath: /api/consent-manager-bene
    istio:
      enabled: true
      virtualservice:
        enabled: true
        host: '{{ tpl .Values.global.consentManagerBeneHostname $ }}'
        gateway: istio-system/staging
        destination: '{{ .Release.Name }}-cm-bene-api'
        destinationPort: 80
        prefix: /api/consent-manager-bene/
        rewriteUri: /
      gateway:
        enabled: false
  global:
    consentManagerHostname: consent-manager.qa.oanstaging.com
    consentManagerPartnerHostname: consent-manager-partner.qa.oanstaging.com
    consentManagerBeneHostname: ''
  consentManagerApi:
    image:
      pullPolicy: Always
      repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/eoan/consent-manager/consent-manager-api
      tag: 1.1.0-develop.1@sha256:12fe280e3faed5dc497f0ffcaad747ea73b7b16593e009693b6034c87431d075
    envVars:
      CONSENT_MANAGER_AWE_CALLBACK_URL: http://{{ .Release.Name }}-cm-api.{{ .Release.Namespace }}.svc.cluster.local/consent/v1/awe/webhooks/decision
    istio:
      virtualservice:
        gateway: istio-system/staging
  ui:
    image:
      pullPolicy: Always
      repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/eoan/consent-manager/consent-manager-ui
      tag: 1.1.0-develop.1@sha256:e8b4415628c36e2fe872296c840ab73fc7c911ab1fe5eb73314b934edc39e101
    istio:
      virtualservice:
        gateway: istio-system/staging
  sanity:
    image:
      pullPolicy: Always
      repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/eoan/consent-manager/consent-manager-sanity
      tag: 1.1.0-develop.1@sha256:16f3ac3f098ffaae538a8698386cfe690fc9aeb2746f587edcca36ef3c6b6870
keymanager:
  istio:
    virtualservice:
      gateway: istio-system/staging
openg2p-awe:
  istio:
    virtualservice:
      gateway: istio-system/staging
# Services the Farmer registry, ODK intake and enrichment need. These equal the chart
# defaults; they are stated so a later default change cannot switch them off on staging.
websub:
  enabled: true
websubTopicProvisioning:
  enabled: true
aggregation-api:
  enabled: true
  virtualService:
    gateway: istio-system/staging
  # Staging's registry catalog: the chart default with the qa partner hosts and Livestock in namespace live,
  # the same scopes and field allowlists as New Dev. It replaces the Farmer-only aggregation-api-catalog
  # ConfigMap, which is left in place (nothing reads it once the pods roll).
  catalog:
    registries:
      FARMER_REGISTRY:
        name: Farmer Registry
        partner_api:
          base_url: https://partner-farmer.qa.oanstaging.com
          receiver_id: farmer-registry
        staff_api:
          base_url: http://farmer-registry-staff-portal-api.farmer.svc.cluster.local
          registers:
          - Farmer
        binding:
          audience: agg-layer-farmer
          controller_id: farmer-registry
          allowed_purposes:
          - loan_origination
          - subsidy_verification
        search:
          reg_type: Farmer
          reg_record_type: spdci-extensions-dci:FarmerRecord
          id_type: UIN
          match:
            path: farmer_personal_details.member_identifier[]
            strip_prefixes:
            - FAN-
        registers:
          FARMER:
            name: Farmer
            functional_record_id: farmer_personal_details.member_identifier[].identifier_value
            last_approved_at: farmer_personal_details.last_updated
        scopes:
          farmer_personal_details:
            register: FARMER
            fields:
            - member_identifier[].identifier_value
            - demographic_info.name.given_name
            - demographic_info.name.second_name
            - demographic_info.name.surname
            - demographic_info.phone_number
            - demographic_info.sex
            - demographic_info.birth_date
            - marital_status
            - education_level
            - registration_date
          family_details:
            table: HOUSEHOLD
            name: Household
            parent: FARMER
            internal_record_id: group_identifier[].identifier_value
            fields:
            - '*'
          farm_details:
            table: FARM
            name: Farm
            parent: FARMER
            fields:
            - '*'
      LIVESTOCK_REGISTRY:
        name: Livestock Registry
        partner_api:
          base_url: https://partner-livestock.qa.oanstaging.com
          receiver_id: livestock-registry
        staff_api:
          base_url: http://livestock-registry-staff-portal-api.live.svc.cluster.local
          registers:
          - Farmer
          - Livestock
        binding:
          audience: agg-layer-livestock
          controller_id: livestock-registry
          allowed_purposes:
          - loan_origination
          - subsidy_verification
        search:
          reg_type: Livestock
          reg_record_type: spdci-extensions-dci:LivestockRecord
          id_type: UIN
          match:
            path: livestock_details.farmer_info.member_identifier[]
            strip_prefixes:
            - FAN-
        registers:
          LIVESTOCK:
            name: Livestock holding
            functional_record_id: livestock_details.record_identifier[].identifier_value
            record_status: livestock_details.status
        scopes:
          livestock_details:
            register: LIVESTOCK
            fields:
            - record_identifier[].identifier_value
            - oan_id
            - status
            - total_animals
            - registration_date
            - farmer_info.demographic_info.name.given_name
            - farmer_info.demographic_info.name.surname
            - farmer_info.phone_number
            - place
          animal_details:
            table: ANIMAL
            name: Animal
            parent: LIVESTOCK
            fields:
            - '*'
          health_event_details:
            table: HEALTH_EVENT
            name: Health event
            parent: LIVESTOCK
            fields:
            - '*'
          vaccination_details:
            table: VACCINATION
            name: Vaccination
            parent: LIVESTOCK
            fields:
            - '*'
          vital_event_details:
            table: VITAL_EVENT
            name: Vital event
            parent: LIVESTOCK
            fields:
            - '*'
          breeding_details:
            table: BREEDING
            name: Breeding
            parent: LIVESTOCK
            fields:
            - '*'
      CROPSOWN_REGISTRY:
        name: Crop Sown Registry
        partner_api:
          base_url: https://partner-crop.qa.oanstaging.com
          receiver_id: cropsown-registry
        staff_api:
          base_url: http://cropsown-registry-staff-portal-api.crop.svc.cluster.local
          registers:
          - CropSown
        binding:
          audience: agg-layer-cropsown
          controller_id: cropsown-registry
          allowed_purposes:
          - loan_origination
          - subsidy_verification
        search:
          reg_type: CropSown
          reg_record_type: spdci-extensions-dci:CropSownRecord
          id_type: UIN
          match:
            path: crop_sown_details.farmer_info.member_identifier[]
            strip_prefixes:
            - FAN-
        registers:
          CROP_SOWN:
            name: Crop sown
            functional_record_id: crop_sown_details.record_identifier[].identifier_value
        scopes:
          crop_sown_details:
            register: CROP_SOWN
            fields:
            - '*'
          farm_details:
            table: FARM
            name: Farm
            parent: CROP_SOWN
            fields:
            - '*'
          crop_production_details:
            table: CROP_PRODUCTION
            name: Crop production
            parent: CROP_SOWN
            fields:
            - '*'
          infestation_details:
            table: INFESTATION
            name: Infestation
            parent: CROP_SOWN
            fields:
            - '*'
          cluster_details:
            table: CLUSTER
            name: Cluster
            parent: CROP_SOWN
            fields:
            - '*'
# The pinned chart (environments/staging/commons-services.chart) predates the oan-aggregation-api subchart (9b8df9f)
# and still reads aggregationApi. Keep both keys until staging pins a chart with the subchart; then drop this one.
aggregationApi:
  enabled: true
  virtualService:
    gateway: istio-system/staging
# The Aggregation API's staff search role (chart templates/aggregation-staff-grant.yaml) for the staff
# test user, so staff search can be checked on staging. Granted by Helm only, never in the console.
aggregationStaffGrant:
  users: [nina.patel]
consentPartnerPortal:
  enabled: true
  virtualService:
    gateway: istio-system/staging

# IAM beneficiary portal API, as on New Dev, with the same eSignet login provider row as dev
# (login_providers id 11, client oan-iam-bene). esignetClient creates Secret iam-bene-esignet-key (key
# private_key, PEM) and registers the client in this eSignet (redirect
# https://bene-iam.qa.oanstaging.com/auth/callback, the key's public JWK, private_key_jwt) on every
# install and upgrade, ahead of the seed Job, which writes the login row (seed on since the client was registered).
iamBenePortalApi:
  enabled: true
  virtualService:
    enabled: true
    host: bene-iam.qa.oanstaging.com
    gateway: istio-system/staging
  loginProvider:
    seed: true
    id: 11
    providerName: e-Signet
    description: Sign in with e-Signet
    clientId: oan-iam-bene
    privateKeySecret:
      name: iam-bene-esignet-key
      key: private_key
    issuer: https://esignet.qa.oanstaging.com
    serverMetadataUrl: https://esignet.qa.oanstaging.com/v1/esignet/oidc/.well-known/openid-configuration
    adapterName: esignet
    jwtAssertionAud: https://esignet.qa.oanstaging.com/v1/esignet/oauth/v2/token
    scope: openid profile
    enablePkce: true
    extraAuthorizeParams: '{"claims":{"userinfo":{"individual_id":{"essential":true},"name":{"essential":false},"address":{"essential":false},"picture":{"essential":false}},"id_token":{}},"acr_values":"mosip:idp:acr:static-code"}'
    defaultRedirectUri: https://bene-portal.qa.oanstaging.com

# Staff-realm public clients answer only on the qa hosts. prune: true replaces each listed
# client's redirect URIs and web origins with exactly the declared ones, so the old
# *.oanstaging.com, *.commons.staging.openg2p.test and *.commons.openg2p.org entries go.
# registry-connector-ui comes from keycloak-init (connector-*.{{ baseDomain }}); the rest are
# created by subcharts and are declared here.
keycloakPublicClientUrls:
  prune: true
  extraClients:
  - realm: staff
    clientId: consent-manager-ui
    redirectUris:
    - 'https://{{ tpl (index .Values "openg2p-consent-manager" "global" "consentManagerHostname") $ }}/*'
    webOrigins:
    - 'https://{{ tpl (index .Values "openg2p-consent-manager" "global" "consentManagerHostname") $ }}'
  - realm: staff
    clientId: awe-admin-portal
    redirectUris:
    - 'https://{{ .Values.global.aweHostname }}/*'
    webOrigins:
    - 'https://{{ .Values.global.aweHostname }}'
  - realm: staff
    clientId: iam-staff-ui
    redirectUris:
    - 'https://iam-staff-ui.{{ .Values.global.baseDomain }}/*'
    webOrigins:
    - 'https://iam-staff-ui.{{ .Values.global.baseDomain }}'

# Object store (Garage), MinIO to Garage cutover. Translated from the Dev equivalent with staging's own host and
# gateway (istio-system/staging); Dev's literal hostnames are not used. MinIO stays installed and serving as the
# rollback, so the compatibility Service (commons-minio:9000 -> Garage) is NOT enabled: that name is MinIO's own
# Service on staging. Likewise the restore Job is off: the data was restored by a one-off Job already.
#
# route: the public S3 host for Garage, the registries' minioHost and CSP image source (staging values of the four
#   registries). It is a new host, so MinIO's host minio-farmer.qa.oanstaging.com keeps pointing at MinIO.
# credentialsSync: after every install and upgrade, copies the four keys of Secret commons-minio (now Garage's) into
#   the Secret of the same name in each registry namespace, where the registries read them. Needs the Roles in
#   environments/staging/rbac/object-store-credentials-rbac.yaml, applied once by hand beforehand.
objectStore:
  enabled: true
  route:
    enabled: true
    hosts:
    - garage.qa.oanstaging.com
    gateway: istio-system/staging
  credentialsSync:
    enabled: true
    namespaces: [farmer, crop, live, da-registry]
