# Staging: let the Commons services chart copy Secret commons-minio (Garage's keys) into the four registry namespaces.
#
# objectStore.credentialsSync (environments/staging/values/commons-services.yaml) runs a post-install/post-upgrade
# Job as ServiceAccount commons/commons-services-object-store-credentials. A chart renders only into its own
# namespace, so the Roles that let that account write the Secret in each registry namespace live here and are applied
# once by hand before the commons-services upgrade:
#   kubectl apply -f environments/staging/rbac/object-store-credentials-rbac.yaml
# The Job only ever touches Secret commons-minio (create to make a missing one, get and patch to update it).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: commons-services-object-store-credentials
  namespace: farmer
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["commons-minio"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: commons-services-object-store-credentials
  namespace: farmer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: commons-services-object-store-credentials
subjects:
- kind: ServiceAccount
  name: commons-services-object-store-credentials
  namespace: commons
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: commons-services-object-store-credentials
  namespace: crop
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["commons-minio"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: commons-services-object-store-credentials
  namespace: crop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: commons-services-object-store-credentials
subjects:
- kind: ServiceAccount
  name: commons-services-object-store-credentials
  namespace: commons
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: commons-services-object-store-credentials
  namespace: live
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["commons-minio"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: commons-services-object-store-credentials
  namespace: live
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: commons-services-object-store-credentials
subjects:
- kind: ServiceAccount
  name: commons-services-object-store-credentials
  namespace: commons
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: commons-services-object-store-credentials
  namespace: da-registry
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["commons-minio"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: commons-services-object-store-credentials
  namespace: da-registry
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: commons-services-object-store-credentials
subjects:
- kind: ServiceAccount
  name: commons-services-object-store-credentials
  namespace: commons
