{{- if .Values.databases }}
{{- range .Values.databases }}
{{- if not (regexMatch "^[a-z_][a-z0-9_]{0,62}$" (required "databases[].name is required" .name)) }}
{{- fail (printf "databases[].name %q: use lower-case letters, digits and _ only" .name) }}
{{- end }}
{{- if has .name (list "postgres" "template0" "template1") }}
{{- fail (printf "databases[].name %q is a system database" .name) }}
{{- end }}
{{- end }}
# Creates each database and its login role on the shared PostgreSQL, as the superuser. Role names and passwords come
# from the application's Secrets as env vars and reach psql through \getenv on stdin, never argv; psql quotes them
# (format %I / %L). Statement logging and pgaudit are off for the session, so a password never lands in the server log.
# A post-install/post-upgrade hook: a failure fails the helm upgrade.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: frappe-common-databases
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    # Re-run when the list changes; the Secrets' values are re-read on every run.
    checksum/databases: {{ toJson .Values.databases | sha256sum }}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frappe-common-databases
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: databases
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          env:
            - {name: PGHOST, value: {{ .Values.postgres.host | quote }}}
            - {name: PGPORT, value: {{ .Values.postgres.port | quote }}}
            - {name: PGUSER, value: {{ .Values.postgres.adminUser | quote }}}
            - {name: PGDATABASE, value: postgres}
            - {name: PGCONNECT_TIMEOUT, value: "10"}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.adminSecret.name | quote }}
                  key: {{ .Values.postgres.adminSecret.key | quote }}
            - {name: DB_COUNT, value: {{ len .Values.databases | quote }}}
            {{- range $i, $db := .Values.databases }}
            - {name: DB_{{ $i }}_NAME, value: {{ $db.name | quote }}}
            - name: DB_{{ $i }}_USER
              valueFrom:
                secretKeyRef:
                  name: {{ required "databases[].secret is required" $db.secret | quote }}
                  key: {{ required "databases[].userKey is required" $db.userKey | quote }}
            - name: DB_{{ $i }}_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $db.secret | quote }}
                  key: {{ required "databases[].passwordKey is required" $db.passwordKey | quote }}
            {{- end }}
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              for _ in $(seq 1 30); do
                psql -X -Atqc 'select 1' >/dev/null 2>&1 && break
                echo "waiting for $PGHOST:$PGPORT"; sleep 5
              done
              for i in $(seq 0 $((DB_COUNT - 1))); do
                name_var="DB_${i}_NAME"; user_var="DB_${i}_USER"; pass_var="DB_${i}_PASSWORD"
                export DB="${!name_var}" APP_USER="${!user_var}" APP_PASSWORD="${!pass_var}"
                case "$APP_USER" in
                  ""|postgres|"$PGUSER") echo "$DB: role '$APP_USER' is empty or the superuser; refusing" >&2; exit 1 ;;
                esac
                if [ -z "$APP_PASSWORD" ]; then echo "$DB: empty password for $APP_USER; refusing" >&2; exit 1; fi
                psql -X -q -v ON_ERROR_STOP=1 <<'SQL'
              SET log_statement = 'none';
              SET pgaudit.log = 'none';
              \getenv db DB
              \getenv usr APP_USER
              \getenv pw APP_PASSWORD
              SELECT format('CREATE ROLE %I LOGIN', :'usr')
                WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'usr') \gexec
              SELECT format('ALTER ROLE %I WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD %L',
                :'usr', :'pw') \gexec
              SELECT format('CREATE DATABASE %I OWNER %I', :'db', :'usr')
                WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'db') \gexec
              SELECT format('REVOKE ALL ON DATABASE %I FROM PUBLIC', :'db') \gexec
              SELECT format('GRANT ALL ON DATABASE %I TO %I', :'db', :'usr') \gexec
              SQL
                owner=$(psql -X -Atqc "select pg_get_userbyid(datdba) from pg_database where datname = '$DB'")
                if [ "$owner" != "$APP_USER" ]; then
                  echo "$DB: kept; owned by $owner, not $APP_USER (created earlier by someone else)"
                fi
                if PGUSER="$APP_USER" PGPASSWORD="$APP_PASSWORD" PGDATABASE="$DB" psql -X -Atqc 'select 1' >/dev/null; then
                  echo "$DB: ready, $APP_USER signs in"
                else
                  echo "$DB: $APP_USER cannot sign in" >&2; exit 1
                fi
              done
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
