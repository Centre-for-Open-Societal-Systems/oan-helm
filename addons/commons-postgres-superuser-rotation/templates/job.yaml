{{- if .Values.rotation.id }}
{{- $img := .Values.images }}
# One rotation per rotation.id, in three steps that share an in-memory volume (the password never touches a disk,
# a log or an argument list):
#   prepare (kubectl)  stop if the id is recorded as done; otherwise generate the new password, or take the one a
#                      failed earlier run left in Secret <release>-pending, and keep it there before anything changes.
#   apply   (psql)     ALTER ROLE with the current password (statement logging and pgaudit off for this session), then
#                      check that the new password signs in and the old one is refused. A rerun after a failure finds
#                      the new password already active and only checks.
#   publish (kubectl)  write the new value to the Secret and to every copy, record the id, delete the pending Secret,
#                      restart the listed workloads.
# A post-install/post-upgrade hook, so the ServiceAccount and Role exist first; a failure fails the helm upgrade.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rotation.name" . }}
  labels: {{- include "rotation.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: {{- include "rotation.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "rotation.name" . }}
      restartPolicy: Never
      volumes:
        - name: work
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
      initContainers:
        - name: prepare
          image: "{{ $img.kubectl.repository }}@{{ $img.kubectl.digest }}"
          env:
            - {name: ROTATION_ID, value: {{ .Values.rotation.id | quote }}}
            - {name: PENDING, value: {{ include "rotation.pending" . | quote }}}
            - {name: RECORD, value: {{ include "rotation.record" . | quote }}}
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              done_id=$(kubectl get configmap "$RECORD" -o jsonpath='{.data.rotation}' 2>/dev/null || true)
              if [ "$done_id" = "$ROTATION_ID" ]; then
                echo "rotation $ROTATION_ID is already done; nothing to do"; touch /work/skip; exit 0
              fi
              if kubectl get secret "$PENDING" >/dev/null 2>&1; then
                pending_id=$(kubectl get secret "$PENDING" -o jsonpath='{.data.rotation}' | base64 -d)
                if [ "$pending_id" != "$ROTATION_ID" ]; then
                  echo "Secret $PENDING belongs to rotation $pending_id, not $ROTATION_ID; finish or remove it first" >&2
                  exit 1
                fi
                kubectl get secret "$PENDING" -o jsonpath='{.data.password}' | base64 -d > /work/new
                echo "resuming rotation $ROTATION_ID with the password generated by an earlier run"
              else
                tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 32 > /work/new
                kubectl create secret generic "$PENDING" --from-file=password=/work/new \
                  --from-literal=rotation="$ROTATION_ID" >/dev/null
                echo "generated the new password for rotation $ROTATION_ID and kept it in Secret $PENDING"
              fi
              if [ "$(wc -c < /work/new)" -ne 32 ]; then echo "the pending password is not 32 characters" >&2; exit 1; fi
          volumeMounts: [{name: work, mountPath: /work}]
          resources: {{- toYaml .Values.resources | nindent 12 }}
        - name: apply
          image: "{{ $img.postgres.repository }}@{{ $img.postgres.digest }}"
          env:
            - {name: PGHOST, value: {{ .Values.postgres.host | quote }}}
            - {name: PGPORT, value: {{ .Values.postgres.port | quote }}}
            - {name: PGUSER, value: {{ .Values.postgres.user | quote }}}
            - name: PGOLD
              valueFrom: {secretKeyRef: {name: {{ .Values.postgres.secret }}, key: {{ .Values.postgres.secretKey }}}}
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              if [ -f /work/skip ]; then exit 0; fi
              new=$(cat /work/new)
              signs_in() { PGPASSWORD="$1" psql -X -d postgres -Atqc 'select 1' >/dev/null 2>&1; }
              if signs_in "$new"; then
                echo "the new password is already active (rerun after a failure)"
              elif signs_in "$PGOLD"; then
                # The password goes through stdin, never argv. It is [A-Za-z0-9] only, so the literal needs no escaping.
                {
                  echo "SET log_statement = 'none';"
                  echo "SET pgaudit.log = 'none';"
                  echo "ALTER ROLE \"$PGUSER\" PASSWORD '$new';"
                } | PGPASSWORD="$PGOLD" psql -X -q -v ON_ERROR_STOP=1 -d postgres
                echo "ALTER ROLE $PGUSER done"
              else
                echo "neither the current Secret value nor the pending password signs in as $PGUSER; stopping" >&2
                exit 1
              fi
              if signs_in "$new"; then echo "check: new password accepted"; else echo "check: new password REFUSED" >&2; exit 1; fi
              if [ "$PGOLD" != "$new" ]; then
                if signs_in "$PGOLD"; then echo "check: old password still ACCEPTED" >&2; exit 1; fi
                echo "check: old password refused"
              fi
          volumeMounts: [{name: work, mountPath: /work}]
          resources: {{- toYaml .Values.resources | nindent 12 }}
      containers:
        - name: publish
          image: "{{ $img.kubectl.repository }}@{{ $img.kubectl.digest }}"
          env:
            - {name: ROTATION_ID, value: {{ .Values.rotation.id | quote }}}
            - {name: NAMESPACE, value: {{ .Release.Namespace | quote }}}
            - {name: SECRET, value: {{ .Values.postgres.secret | quote }}}
            - {name: SECRET_KEY, value: {{ .Values.postgres.secretKey | quote }}}
            - {name: PENDING, value: {{ include "rotation.pending" . | quote }}}
            - {name: RECORD, value: {{ include "rotation.record" . | quote }}}
            - {name: COPY_TO, value: {{ join " " .Values.copyTo | quote }}}
            - {name: RESTART_DEPLOYMENTS, value: {{ join " " .Values.restart.deployments | quote }}}
            - {name: RESTART_STATEFULSETS, value: {{ join " " .Values.restart.statefulsets | quote }}}
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              if [ -f /work/skip ]; then exit 0; fi
              # Patch files in the in-memory volume: the value never appears in an argument list. The kubectl
              # last-applied annotation of a hand-made copy holds the old value; the Helm annotations on a copy
              # outside this namespace are false. Both are removed.
              value=$(base64 -w0 < /work/new)
              printf '{"metadata":{"annotations":{"kubectl.kubernetes.io/last-applied-configuration":null,"oan.io/rotation":"%s"}},"data":{"%s":"%s"}}' \
                "$ROTATION_ID" "$SECRET_KEY" "$value" > /work/patch.json
              printf '{"metadata":{"annotations":{"meta.helm.sh/release-name":null,"meta.helm.sh/release-namespace":null}}}' > /work/copy.json
              kubectl -n "$NAMESPACE" patch secret "$SECRET" --type merge --patch-file /work/patch.json >/dev/null
              echo "wrote $NAMESPACE/$SECRET"
              for ns in $COPY_TO; do
                kubectl -n "$ns" patch secret "$SECRET" --type merge --patch-file /work/patch.json >/dev/null
                kubectl -n "$ns" patch secret "$SECRET" --type merge --patch-file /work/copy.json >/dev/null
                echo "wrote copy $ns/$SECRET"
              done
              kubectl -n "$NAMESPACE" create configmap "$RECORD" --from-literal=rotation="$ROTATION_ID" \
                --dry-run=client -o yaml | kubectl -n "$NAMESPACE" apply -f - >/dev/null
              kubectl -n "$NAMESPACE" delete secret "$PENDING" >/dev/null
              echo "recorded rotation $ROTATION_ID; removed Secret $PENDING"
              for d in $RESTART_DEPLOYMENTS; do kubectl -n "$NAMESPACE" rollout restart deployment "$d"; done
              for s in $RESTART_STATEFULSETS; do kubectl -n "$NAMESPACE" rollout restart statefulset "$s"; done
          volumeMounts: [{name: work, mountPath: /work}]
          resources: {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
