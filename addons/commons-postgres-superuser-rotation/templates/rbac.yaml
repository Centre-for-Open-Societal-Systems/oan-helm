{{- if .Values.rotation.id }}
# Rights of the rotation Job in this namespace only. The copies in other namespaces are granted by the per-environment
# RBAC file (applied once by the cluster admin), because the Commons deployer has no rights outside this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rotation.name" . }}
  labels: {{- include "rotation.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "rotation.name" . }}
  labels: {{- include "rotation.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.postgres.secret | quote }}, {{ include "rotation.pending" . | quote }}]
    verbs: ["get", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ include "rotation.record" . | quote }}]
    verbs: ["get", "patch"]
  # create cannot be limited by name in Kubernetes RBAC.
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["create"]
  {{- with concat .Values.restart.deployments .Values.restart.statefulsets }}
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    resourceNames: {{ toJson . }}
    verbs: ["get", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "rotation.name" . }}
  labels: {{- include "rotation.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "rotation.name" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "rotation.name" . }}
{{- end }}
