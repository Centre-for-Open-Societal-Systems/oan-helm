# k3s manifest for the `oan_dev` node: copy to /var/lib/rancher/k3s/server/manifests/coredns-custom.yaml
# (k3s owns this ConfigMap as an Addon from that file, so Helm cannot manage it; edit the file, not the object).
#
# Pods on oan_dev resolve every *.development.oanstaging.com name to the APISIX gateway Service instead of
# public DNS, so a UI's server-side call to its backend reaches APISIX before public DNS points at this node.
# The pod keeps the original host name, so APISIX presents the Let's Encrypt wildcard and TLS verifies.
# APISIX routes grievance/A2C itself and sends every other host to the OpenG2P istio (edge catch-all route).
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  rancher.server: |
    rancher.oan-services-dev.test:53 {
        hosts {
            10.0.1.131 rancher.oan-services-dev.test
        }
    }
  development.override: |
    rewrite stop name regex (.+\.)?development\.oanstaging\.com\.? apisix-gateway.api6-gateway.svc.cluster.local. answer auto
