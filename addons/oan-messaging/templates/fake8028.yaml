{{- if .Values.fake8028.enabled }}
{{- $name := printf "%s-fake-8028" (include "oanmsg.svc" .) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels: {{- include "oanmsg.labels" . | nindent 4 }}
data:
  fake8028.py: |-
{{ .Files.Get "files/fake8028.py" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "oanmsg.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/component: fake-8028, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports:
    - {name: gateway, port: 8443, targetPort: 8443}
    - {name: inbox, port: 8080, targetPort: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "oanmsg.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/component: fake-8028, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/component: fake-8028, app.kubernetes.io/instance: {{ .Release.Name }}}
      annotations:
        checksum/script: {{ .Files.Get "files/fake8028.py" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- include "oanmsg.pullSecrets" . | nindent 6 }}
      securityContext: {runAsUser: 10001, runAsGroup: 10001, runAsNonRoot: true, fsGroup: 10001}
      containers:
        - name: fake8028
          image: {{ include "oanmsg.serviceImage" . | quote }}
          command: [python, /tools/fake8028.py]
          env:
            - {name: CERTS_DIR, value: /certs}
            - {name: FAKE8028_CALLBACK_URL, value: {{ printf "https://%s-receipts/sms-status-receiver/v1/update-status" (include "oanmsg.svc" .) | quote }}}
            - {name: FAKE8028_MODE, value: {{ .Values.fake8028.mode | quote }}}
            - {name: FAKE8028_CALLBACK_DELAY, value: {{ .Values.fake8028.callbackDelaySeconds | quote }}}
            - name: FAKE8028_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: oan-messaging-fake8028, key: client-secret}}
            - name: FAKE8028_CALLBACK_SECRET
              valueFrom: {secretKeyRef: {name: oan-messaging-fake8028, key: callback-secret}}
          ports:
            - {name: gateway, containerPort: 8443}
            - {name: inbox, containerPort: 8080}
          readinessProbe: {tcpSocket: {port: gateway}, periodSeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: 250m, memory: 192Mi}
          volumeMounts:
            - {name: tools, mountPath: /tools, readOnly: true}
            - {name: certs, mountPath: /certs, readOnly: true}
      volumes:
        - {name: tools, configMap: {name: {{ $name }}}}
        - name: certs
          secret:
            secretName: oan-messaging-fake8028
            defaultMode: 0440
{{- end }}
