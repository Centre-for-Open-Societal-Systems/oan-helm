{{- if .Values.statusCheck.enabled }}
{{- $c := dict "root" . "component" "status-check" }}
{{- include "oan.requireCommand" (dict "cmd" .Values.statusCheck.command "name" "statusCheck") }}
# Alert check: one `status --fail-on-alert` run per schedule. Exit 2 (an active alert)
# fails the Job; route failed Jobs of this CronJob to paging. Prints counts only.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "oan.componentName" $c }}
  labels:
    {{- include "oan.labels" $c | nindent 4 }}
spec:
  schedule: {{ .Values.statusCheck.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        {{- include "oan.labels" $c | nindent 8 }}
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ .Values.statusCheck.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            {{- include "oan.labels" $c | nindent 12 }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "oan.serviceAccountName" . }}
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            {{- include "oan.podSecurityContext" . | nindent 12 }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: status-check
              image: {{ include "oan.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              {{- with .Values.image.workingDir }}
              workingDir: {{ . }}
              {{- end }}
              command:
                {{- toYaml .Values.statusCheck.command | nindent 16 }}
              envFrom:
                {{- include "oan.envFromConfig" . | nindent 16 }}
              env:
                {{- include "oan.storageEnv" (dict "root" . "pool" .Values.statusCheck.pool) | nindent 16 }}
              resources:
                {{- toYaml .Values.statusCheck.resources | nindent 16 }}
              securityContext:
                {{- include "oan.containerSecurityContext" . | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {sizeLimit: 16Mi}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
