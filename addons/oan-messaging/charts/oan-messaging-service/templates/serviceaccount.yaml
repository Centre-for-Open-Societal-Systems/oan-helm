{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "oan.serviceAccountName" . }}
  labels:
    {{- include "oan.labels" (dict "root" . "component" "runtime") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The service never calls the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
