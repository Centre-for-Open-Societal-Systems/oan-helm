componentsAwaitingImages:
- Current standalone registry dashboard UIs (legacy Crop UI is not substituted).
- DA backend/dashboard workloads; da-registry-frontend is a different app.
- OAN Sandbox API and web (sandbox-platform images not yet published).
publicationBlockers:
- Crop/Livestock full refactor and preservation acceptance remains incomplete; their
  charts fail closed before rendering workloads.
- Commons native Master Data develop.118 source chart/image upgrade requires restored-data,
  geography, IAM and AWE preservation acceptance.
installationPrerequisites:
- Upgrade existing commons-services/commons only after private backup, migration rehearsal
  and unrelated-resource comparison.
- Configure Aggregation signing Secret, reviewed catalog, staff issuer/JWKS and optional
  staff service-account/view roles.
- Register Partner Management key and matching per-registry Consent bindings before
  consent-based searches.
- Keep OTP unavailable pending SMS. Partner-realm authentication and OTP delivery
  remain separate prerequisites for consent_id flows.
- Current CM signing key is retained for compatibility; dedicated private-key rotation
  needs a separate retention/trust plan.
- The new Aggregation is stateless and requires no own database, queue or migration.
- Rancher can use the published fork preview until upstream PRs are reviewed and merged.
- DA and unavailable dashboard UIs remain disabled.
- 'WebSub: prepare immutable commons-websub-encryption Secret and preserve the dev
  post-renderer, live values and existing release owner.'
changes:
- Pin the Master Data seed image that carries the ETH-OAN pack (upstream develop.118
  seed image with the OAN openg2p-data fork, by digest); geo seeding stays disabled.
- Rancher Master Data defaults match the chart values (ETH-OAN, agriculture, no samples).
