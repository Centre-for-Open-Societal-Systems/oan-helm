# OAN Leads API: dev enablement checklist (public values only).
# Steps, in order:
#   1. Images. Leads API: until the develop pipeline publishes
#      eoan/leads-api/leads-api:0.1.0-develop.<build>, dev pins oan/leads-api (ap-south-1).
#      Telephony: freeswitch-{lead-service,event-publisher,freeswitch} build 23 in
#      ap-northeast-1 (chart defaults, by digest). The node IAM role must be able to pull
#      from both registries; the release keeps the pull secret leads-api-ecr fresh for both.
#   2. Prepare the PostgreSQL database and Elasticsearch the API uses, and their credentials.
#      Telephony brings its own lead_db PostgreSQL (PVC, default StorageClass).
#   3. Create the secret values file (see the chart README) with secret.create: true, the
#      credential keys under secret.values and the database endpoints under config, plus
#      telephony.secret (create: true, DB_USER, DB_PASSWORD, ESL_PASSWORD), and store it as
#      the Jenkins secret-file credential `dev-leads-api-secret-values`. Never commit it.
#   4. FreeSWITCH: pick the node that answers the SIP trunk, open UDP/TCP 5060 and UDP
#      16384-32768 to the trunk in its security group, and set telephony.freeswitch.extIp
#      and nodeSelector.
#   5. helm upgrade --install leads-api charts/oan-leads-api -n leads --create-namespace \
#        -f environments/dev/values/oan-leads-api.yaml -f <secret values file>
#   6. kubectl -n leads rollout status deploy/leads-api (and deploy/leads-api-telephony-*),
#      then open https://leads.development.oanstaging.com/swagger-ui/index.html

image:
  repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/oan/leads-api
  tag: staging-ati-7
  digest: sha256:e3fba3f392b3add9f9c91ba87528878ff5b8f1c7a8b3e2298c5405a2c1db9121
  pullPolicy: IfNotPresent

virtualService:
  enabled: true
  host: leads.development.oanstaging.com
  gateway: istio-system/development

telephony:
  enabled: true
  freeswitch:
    extIp: ""
    nodeSelector: {}
