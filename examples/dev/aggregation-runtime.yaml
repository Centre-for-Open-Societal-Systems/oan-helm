# Reference only: verify Secrets, catalog and staff grants before enabling.
# Values of the oan-aggregation-api subchart (helm show values charts/oan-aggregation-api-<version>.tgz).
aggregation-api:
  enabled: true
  imagePullSecrets:
    - name: ecr-pull-secret
  virtualService:
    enabled: true
    host: 'aggregation.{{ .Values.global.baseDomain }}'
    gateway: istio-system/development
  # Mounted at /app/keys; the chart sets the signing path, password and kid variables.
  signing:
    existingSecret: aggregation-api-signing
    p12Key: aggregation.p12
    passwordKey: password
    kid: oan-aggregation-development-20261019
  # Loaded whole as environment: AGGREGATION_LAYER_STAFF_API_CLIENT_SECRET and other secrets.
  runtimeSecret: aggregation-api-runtime
  # Mounted at /app/config/registries.yaml.
  catalog:
    existingConfigMap: aggregation-api-catalog
  env:
    AGGREGATION_LAYER_CM_BASE_URL: http://commons-services-cm-partner-api.commons.svc.cluster.local
    AGGREGATION_LAYER_AUTH_ENABLED: 'true'
    AGGREGATION_LAYER_AUTH_ISSUER: 'https://keycloak.{{ .Values.global.baseDomain }}/realms/staff'
    AGGREGATION_LAYER_AUTH_JWKS_URL: http://commons-keycloak.commons.svc.cluster.local/realms/staff/protocol/openid-connect/certs
    AGGREGATION_LAYER_STAFF_SEARCH_ROLES: '["AGGREGATION_STAFF_VIEWER"]'
    AGGREGATION_LAYER_STAFF_API_TOKEN_URL: 'https://keycloak.{{ .Values.global.baseDomain }}/realms/staff/protocol/openid-connect/token'
    AGGREGATION_LAYER_STAFF_API_CLIENT_ID: aggregation-layer-staff
