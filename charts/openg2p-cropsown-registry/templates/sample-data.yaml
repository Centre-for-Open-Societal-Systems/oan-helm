{{- if .Values.sampleData.enabled }}
{{/*
Load the Crop Sown Registry's sample data from openg2p-data (opt-in, development only).

The loader ships in this registry's db-seed image (/seed/load_sample_data.py).
It enters each sample record through the staff API the way an officer does,
and approves it at stage 1 and stage 2 as the sample approvers, who sign in
like the staff portal: staff IAM, the Keycloak login form, IAM's callback. It
never uses the password grant and never changes Keycloak.

The openg2p-registry subchart's db-seed Job runs the reference loader, which
signs in with the password grant and is given no staff IAM address, so this
registry's loader runs here instead, after that Job (hook weight 10) has
applied the metadata. The loader is idempotent: records already present are
skipped.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-sample-data
  labels:
    app.kubernetes.io/name: sample-data
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "20"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.sampleData.backoffLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-data
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      containers:
        - name: sample-data
          image: {{ include "cropsown.reporting.image" . | quote }}
          command: ["python3", "/seed/load_sample_data.py"]
          env:
            {{- include "cropsown.reporting.dbEnv" . | nindent 12 }}
            - name: STAFF_API_URL
              value: {{ tpl (.Values.sampleData.staffApiUrl | default (printf "http://%s-staff-portal-api" .Release.Name)) . | quote }}
            - name: STAFF_IAM_URL
              value: {{ required "sampleData.staffIamUrl is required" (tpl .Values.sampleData.staffIamUrl .) | quote }}
            - name: INTAKE_SEED_SUBMIT_USER
              value: {{ .Values.sampleData.submitUser | quote }}
            - name: INTAKE_SEED_APPROVER_1
              value: {{ .Values.sampleData.approver1 | quote }}
            - name: INTAKE_SEED_APPROVER_2
              value: {{ .Values.sampleData.approver2 | quote }}
            - name: INTAKE_SEED_PASSWORD
              value: {{ required "sampleData.password (the sample staff users' password) is required" (.Values.sampleData.password | default .Values.global.aweApproverUserPassword) | quote }}
            - name: INTAKE_SEED_APPROVE_TIMEOUT
              value: {{ .Values.sampleData.approveTimeoutSeconds | toString | quote }}
            - name: INTAKE_SEED_INGEST_TIMEOUT
              value: {{ .Values.sampleData.ingestTimeoutSeconds | toString | quote }}
          resources: {{- toYaml .Values.sampleData.resources | nindent 12 }}
{{- end }}
