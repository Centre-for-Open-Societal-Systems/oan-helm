# Defaults for the OAN log pipeline.
# By default, loki and grafana are disabled because logs are forwarded to the centralized
# Loki/Grafana instance running on openg2p_dev (10.0.1.58) over the private VPC.
#
# otel-agent runs as a DaemonSet to tail /var/log/pods, redact PII, promote K8s attributes,
# and stream logs directly to openg2p_dev via OTLP gRPC.
#
# If an in-cluster gateway is desired for local queueing, set otel-gateway.enabled=true.
# If a standalone in-cluster log store is desired, set loki.enabled=true and grafana.enabled=true.

loki:
  enabled: false
  fullnameOverride: loki
  # For an object store outside this release, set minio.enabled=false and
  # loki.storage.s3.* (endpoint, accessKeyId, secretAccessKey) instead.
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: s3
      bucketNames:
        chunks: chunks
        ruler: ruler
        admin: admin
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    limits_config:
      retention_period: 336h
    compactor:
      retention_enabled: true
      delete_request_store: s3
  singleBinary:
    replicas: 1
    persistence:
      size: 5Gi
  minio:
    enabled: true
    replicas: 1
    rootUser: root-user
    rootPassword: ""
    users:
      - accessKey: logs-user
        secretKey: ""
        policy: readwrite
    persistence:
      size: 10Gi
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false

otel-gateway:
  enabled: false
  fullnameOverride: otel-gateway
  mode: deployment
  replicaCount: 1
  image:
    repository: otel/opentelemetry-collector-contrib
  # `alternateConfig` replaces the chart's default config.
  alternateConfig:
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        send_batch_size: 1024
        timeout: 5s
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
    exporters:
      otlphttp/loki:
        endpoint: http://10.0.1.58:30318/otlp
        headers:
          X-Scope-OrgID: fake
        tls:
          insecure: true
    service:
      extensions: [health_check]
      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/loki]
        metrics: null
        traces: null
  ports:
    otlp: {enabled: true}
    otlp-http: {enabled: true}
    jaeger-compact: {enabled: false}
    jaeger-thrift: {enabled: false}
    jaeger-grpc: {enabled: false}
    zipkin: {enabled: false}
    metrics: {enabled: false}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

# One agent per cluster (DaemonSet). Reads /var/log/pods, scrubs PII, promotes k8s metadata,
# and streams logs to openg2p_dev (10.0.1.58:30317) or the in-cluster otel-gateway.
otel-agent:
  enabled: true
  fullnameOverride: otel-agent
  mode: daemonset
  image:
    repository: otel/opentelemetry-collector-contrib
  presets:
    logsCollection:
      enabled: true
      includeCollectorLogs: false
    kubernetesAttributes:
      enabled: true
  alternateConfig:
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
    processors:
      batch:
        send_batch_size: 1024
        timeout: 5s
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      transform/redact_pii:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - replace_pattern(body, "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "[REDACTED_EMAIL]")
              - replace_pattern(body, "\\b\\d{12}\\b", "[REDACTED_ID]")
              - replace_pattern(body, "(?i)(password|passwd|token|secret|authorization|bearer|api[_-]?key)\\s*[=:]\\s*\\S+", "[REDACTED_SECRET]")
      transform/promote_k8s:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(resource.attributes["k8s.namespace.name"], attributes["k8s.namespace.name"]) where resource.attributes["k8s.namespace.name"] == nil
              - set(resource.attributes["k8s.pod.name"], attributes["k8s.pod.name"]) where resource.attributes["k8s.pod.name"] == nil
              - set(resource.attributes["k8s.container.name"], attributes["k8s.container.name"]) where resource.attributes["k8s.container.name"] == nil
              - set(resource.attributes["service.name"], attributes["k8s.container.name"]) where resource.attributes["service.name"] == nil
    exporters:
      otlp:
        endpoint: 10.0.1.58:30317
        tls:
          insecure: true
    service:
      extensions: [health_check]
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, k8sattributes, transform/redact_pii, transform/promote_k8s, batch]
          exporters: [otlp]
        metrics: null
        traces: null
  ports:
    jaeger-compact: {enabled: false}
    jaeger-thrift: {enabled: false}
    jaeger-grpc: {enabled: false}
    zipkin: {enabled: false}
    metrics: {enabled: false}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

grafana:
  enabled: false
  fullnameOverride: grafana
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Loki
          type: loki
          access: proxy
          url: http://loki.observability.svc:3100
          isDefault: true
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
