global:
  baseDomain: '{{ .Release.Namespace }}.openg2p.org'
  registryVariant: farmer-registry
  registryHostname: '{{ .Release.Name }}.{{ tpl .Values.global.baseDomain $ }}'
  minioHost: commons-minio:9000
  minioSecure: false
  postgresqlHost: commons-postgresql
  registryDB: '{{ printf "%s" .Release.Name | replace "-" "_" }}'
  registryDBPort: 5432
  registryDBUser: '{{ printf "%s_user" .Release.Name | replace "-" "_" }}'
  registryDBSecret: '{{ .Release.Name }}'
  registryDBUserPasswordKey: '{{ .Release.Name }}-db-user'
  keycloakBaseUrl: https://keycloak.{{ tpl .Values.global.baseDomain $ }}
  keycloakRealm: staff
  keycloakIssuerUrl: '{{ tpl .Values.global.keycloakBaseUrl $ }}/realms/{{ tpl .Values.global.keycloakRealm
    $ }}'
  masterDataApiUrl: http://commons-services-master-data-api
  masterDataTokenUrl: '{{ tpl .Values.global.keycloakIssuerUrl $ }}/protocol/openid-connect/token'
  authClientId: '{{ .Release.Name }}-staff-portal'
  authClientSecret: '{{ .Release.Name }}-staff-portal'
  authClientSecretKey: client_secret
registry:
  staffUi:
    image:
      repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/openg2p/farmer-registry/staff-ui
      tag: 90811b61a59f@sha256:e7e5c7d8d0935f8e2957019afe68cad168de8d08f34b52cffc8c91fe92d7cbc4
  staffApi:
    image:
      repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/openg2p/farmer-registry/staff-api
      tag: 90811b61a59f@sha256:b8116e52f51c85d228d26ab97113b75cf293a9dfba120a062c16d97727039ed5
  partnerApi:
    image:
      repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/openg2p/farmer-registry/partner-api
      tag: 90811b61a59f@sha256:800b7b097a4fd8bf7a09ef0e24969ed374e0126933d9aa79c47e186644f4315c
  celeryWorker:
    image:
      repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/openg2p/farmer-registry/celery
      tag: 90811b61a59f@sha256:15273f1e29b54f02df09b0bb69c5cf21d68432c1c34f0dd6521a1fbfe64b49c2
  celeryBeat:
    image:
      repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/openg2p/farmer-registry/celery
      tag: 90811b61a59f@sha256:15273f1e29b54f02df09b0bb69c5cf21d68432c1c34f0dd6521a1fbfe64b49c2
  dbSeed:
    image:
      repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/openg2p/farmer-registry/db-seed
      tag: 90811b61a59f@sha256:0b48d9f90be2734a131bcea08219c79cb9251307f13b422ead94f56fb7a00cd9
    loadSampleData: false
    loadImages: false
    loadTemplates: true
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi
  iamRegister:
    applicationDescription: Farmer Registry
    runAsHook: false
  idgenerator:
    idGenerator:
      appConfig:
        idTypes:
          farmer:
            idLength: 12
          household:
            idLength: 10
  sanity:
    enabled: true
    image:
      repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/openg2p/farmer-registry/sanity-tests
      tag: 90811b61a59f@sha256:baceebd88b20c4eefc9ed85473f1f9fe21a2ed86c9ee776da05e6ae47ed4e95d
    regType: Farmer
    regRecordType: spdci-extensions-dci:Farmer
    searchText: SANITY-FARMER-0001
    dataScopes: personal_details
    deniedScopes: farmer_identifiers,contact
    registerId: a1a4d25a-1cd4-4356-abac-985a0b3c6bcd
    crTabId: farmer_farmer_tab
    crSectionId: farmer_farmer_personal_identification_section_01
  agentPortalApi:
    enabled: false
  agentPortalUi:
    enabled: false
analytics:
  image:
    repository: ''
    tag: ''
  bulkSample:
    enabled: false
    farmers: 100000
    expectedCountry: ''
  reportingViews:
    enabled: true
    generate: false
    refreshSchedule: 0 * * * *
    devOverlay:
      configMap: ''
      files:
      - generate_reporting_views.py
      - reporting_views.sql
      - reporting.yaml
    matchPrefix: fr_rpt_
  dashboards:
    enabled: true
    image:
      repository: apachesuperset.docker.scarf.sh/apache/superset
      tag: 4.0.1
    supersetAdmin: svc-importer
    supersetAdminPasswordSecret:
      generate: true
      name: openg2p-insights-superset-svc
      key: password
    supersetDatabaseName: FR
    superset:
      url: http://commons-services-superset:8088
      required: false
      waitAttempts: 60
      waitSeconds: 5
      envFromSecret: commons-services-superset-env
      dbPasswordSecret:
        name: superset-db-user
        key: superset-db-user-password
      configSecret: commons-services-superset-config
      configKey: superset_config.py
      bootstrapKey: superset_bootstrap.sh
      enableEmbedding: true
    bundleConfigMap: ''
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 2Gi
mapsContent:
  enabled: true
  nameOverride: ''
publicStaffUi:
  enabled: false
  replicas: 1
  env: {}
  volumes: []
  volumeMounts: []
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 768Mi
dashboardApi:
  imagePullSecrets: []
  envFrom: []
  enabled: false
  image:
    digest: sha256:66934adc8a6f5effb3334c8bd80d5afa7eed76486ad8b0ceaf1638a24bc6e6c2
    repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/openg2p/farmer-registry/dashboard-api
    tag: 85fd0a3c2518
  replicas: 1
  workers: 2
  dbPool:
    minSize: 1
    maxSize: 5
  geoLevelTotals: {}
  allowedOrigins: []
  env: {}
  virtualService:
    enabled: false
    host: ''
    gateway: ''
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
cossAddons:
  components:
  - name: registry-connector
    repository: https://github.com/OpenG2P/registry-connector.git
    sourceBranch: develop
    dockerfile: api/Dockerfile
    context: api
    chart: api/deploy/charts/openg2p-connector
    release: farmer-registry-connector
    namespace: farmer
    kind: connector
    allowInstall: true
    imageValues: api.image
    images:
      api:
        dockerfile: api/Dockerfile
        context: api
        overlay: integrations/registry-connector
        imageValues:
        - api.image
        - worker.image
        - beat.image
        - consumer.image
      ui:
        dockerfile: ui/Dockerfile
        context: ui
        imageValues:
        - ui.image
  - name: farmer-registry-dashboard
    repository: https://github.com/Centre-for-Open-Societal-Systems/oan_farmerregistry_dashboard.git
    dockerfile: Dockerfile
    chart: helm/farmer-registry-dashboard
    release: farmer-registry-dashboard
    namespace: farmer
    imageValues: image
  - name: farmer-registry-dashboard-api
    repository: https://github.com/Centre-for-Open-Societal-Systems/farmer-registry-dashboard-api.git
    dockerfile: Dockerfile
    chart: helm/openg2p-farmer-registry
    release: farmer-registry
    namespace: farmer
    kind: registry-dashboard-api
    imageRepository: openg2p/farmer-registry/dashboard-api
    imageValues: dashboardApi.image
dashboardUi:
  enabled: false
  nameOverride: ''
  image:
    repository: ''
    tag: ''
    digest: ''
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  replicas: 1
  containerPort: 3000
  servicePort: 80
  env: []
  envFrom: []
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi
