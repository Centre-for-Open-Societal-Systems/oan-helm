# Defaults for the OAN Grievance UI (oan_grievance_ui). Everything sits under `ui`, the values of
# the ui-service chart this one depends on. Per-environment values live in
# environments/<env>/values/oan-grievance-ui.yaml.
#
# Set at install, not here:
# - ui.image.tag: the Jenkins tag, e.g. develop-<build>-<sha>
# Image repository and the backend URL are per environment.

ui:
  image:
    # Set per environment. package_chart.py needs both keys to exist.
    repository: ""
    tag: ""

  # Matches the Deployment and container the Jenkinsfile updates.
  fullnameOverride: grievance-ui
  containerName: grievance-ui

  env:
    # Read at runtime (src/lib/env.ts); required. Per environment, e.g. https://grievance-backend-dev.oanstaging.com
    AUTH_API_BASE_URL: ""
    # Optional realtime (socket.io). Leave both unset to run REST-only:
    # REALTIME_PUBLIC_URL: wss://...
    # REALTIME_SITE: <frappe site name>

  # "/" redirects to /login, so probe /login directly.
  livenessProbe:
    httpGet:
      path: /login
      port: http
    initialDelaySeconds: 15
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /login
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
