# Defaults for the OAN Grievance Service. Everything sits under `frappe`, the values of the
# frappe chart this one depends on. Per-environment values live in
# environments/<env>/values/oan-grievance-service.yaml. ClamAV is part of this chart
# (templates/clamav.yaml, values under `clamav`).
#
# Set at install, not here:
# - frappe.image.tag: the Jenkins tag `develop-<build>-<sha>` (locally: `develop`)
# - frappe.dbHost: the external PostgreSQL server (docs/external-db-and-nfs.md)
# Image repositories, the seed image and dbRootUser are per environment.
# Secrets created outside Git, in the release namespace:
# - oan-grievance-db (key `password`): password of dbRootUser on that server
# - oan-grievance-admin (key `password`): Frappe Administrator password
# - oan-grievance-jwt (key `jwt_v1.pem`): unencrypted RSA private key, at least 2048 bits
# - oan-grievance-sentry (key `dsn`): Sentry DSN. Optional.
# - oan-grievance-seed (key `password`): password for the demo users. Optional.

# ClamAV for attachment scanning (services/scanning.py): a single-replica Deployment and a ClusterIP
# Service named <release>-clamav. The signature database is downloaded by freshclam on every start
# into an emptyDir. Set enabled to false to run without it (attachments then stay Pending).
clamav:
  enabled: true
  image:
    repository: clamav/clamav-debian
    tag: "1.4"
    pullPolicy: IfNotPresent
  port: 3310
  resources:
    requests:
      memory: 1536Mi
    limits:
      memory: 3Gi

frappe:
  image:
    # Set per environment. package_chart.py needs both keys to exist.
    repository: ""
    tag: ""

  # PostgreSQL runs outside the cluster. The create-site job reads the password of dbRootUser
  # from Secret oan-grievance-db.
  dbHost: ""
  dbPort: 5432
  dbExistingSecret: oan-grievance-db
  dbExistingSecretPasswordKey: password
  postgresql-sts:
    enabled: false

  siteConfig:
    enabled: true
    values:
      jwt_current_kid: v1
      jwt_private_keys:
        v1: keys/jwt_v1.pem
      jwt_self_registerable_roles:
      - Grievance Submitter
      # The Service of the bundled ClamAV (<release>-clamav; release `grievance` gives `grievance-clamav`). Without it attachments stay Pending.
      grievance_clamav_host: grievance-clamav
      grievance_clamav_port: 3310
    files:
    # oan_auth_service refuses every login without it.
    - path: keys/jwt_v1.pem
      secretName: oan-grievance-jwt
      secretKey: jwt_v1.pem
    seed:
      userPasswordSecret:
        name: oan-grievance-seed

  # Queue name: RQ timeout in seconds. Written as `workers` in common_site_config.json;
  # without it frappe.enqueue rejects every job.
  extraWorkers:
  - name: routing
    queues:
      grievance_routing: 300
  - name: sla
    queues:
      grievance_sla: 1800
  - name: scan
    queues:
      grievance_scan: 300
  - name: notifications
    queues:
      grievance_notifications: 600

  # FRAPPE_STREAM_LOGGING sends frappe.logger output to stdout for the cluster collector.
  # FRAPPE_SENTRY_DSN is optional: without the Secret, Sentry stays off.
  worker:
    gunicorn:
      envVars: &frappeEnv
      - name: FRAPPE_STREAM_LOGGING
        value: "1"
      - name: FRAPPE_SENTRY_DSN
        valueFrom:
          secretKeyRef:
            name: oan-grievance-sentry
            key: dsn
            optional: true
    default:
      envVars: *frappeEnv
    short:
      envVars: *frappeEnv
    long:
      envVars: *frappeEnv
    scheduler:
      envVars: *frappeEnv
  socketio:
    envVars: *frappeEnv

  jobs:
    createSite:
      adminExistingSecret: oan-grievance-admin
      installApps:
      - oan_auth_service
      - oan_grievance_service
