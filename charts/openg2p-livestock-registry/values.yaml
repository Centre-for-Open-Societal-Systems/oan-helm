global:
  registryVariant: livestock-registry
  registryHostname: '{{ .Release.Name }}.{{ .Release.Namespace }}.openg2p.org'
registry:
  staffApi:
    image:
      repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/openg2p/livestock-registry/staff-api
      tag: bf78e69a5fd6@sha256:189809772e28eafdeea66070dddfbe92d7ea840b2633dbc068a6f4fb85ae5ed2
    envVars:
      REGISTRY_STAFF_PORTAL_API_VALIDATE_ATTRIBUTE_VALUES: 'true'
      REGISTRY_STAFF_PORTAL_API_APPLICATION_REFERENCE_FORMAT: '{DATE:%Y%b%d|upper}-{SECONDS:5}{RAND:5}'
      REGISTRY_CORE_DOCUMENT_UPLOAD_ALLOWED_EXTENSIONS: png,jpg,jpeg,webp,pdf,csv,xlsx,xls
      REGISTRY_CORE_DOCUMENT_UPLOAD_ALLOWED_MIME_TYPES: image/png,image/jpeg,image/webp,application/pdf,text/csv,text/plain,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/zip
      REGISTRY_STAFF_PORTAL_API_DOCUMENT_UPLOAD_ALLOWED_EXTENSIONS: png,jpg,jpeg,webp,pdf,csv,xlsx,xls
      REGISTRY_STAFF_PORTAL_API_DOCUMENT_UPLOAD_ALLOWED_MIME_TYPES: image/png,image/jpeg,image/webp,application/pdf,text/csv,text/plain,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/zip
      APPROVER_RESOLVER_SECRET: livestock-approver-resolver-secret
      KEYCLOAK_BASE_URL: '{{ tpl .Values.global.keycloakBaseUrl $ }}'
      KEYCLOAK_REALM: '{{ tpl .Values.global.keycloakRealm $ }}'
      AUTH_CLIENT_ID: '{{ tpl .Values.global.authClientId $ }}'
      FARMER_REGISTRY_ENRICHMENT_ENABLED: 'false'
      FARMER_REGISTRY_DCI_SEARCH_URL: ''
      FARMER_REGISTRY_SENDER_ID: ''
      FARMER_REGISTRY_RECEIVER_ID: farmer-registry
      FARMER_REGISTRY_SIGNING_KEY_KID: ''
      FARMER_REGISTRY_SIGNING_ALGORITHM: RS256
      FARMER_REGISTRY_CONSENT_AUDIENCE: ''
      FARMER_REGISTRY_CONSENT_DATA_CONTROLLER: farmer-registry
      FARMER_REGISTRY_CONSENT_SCOPES: farmer_personal_details
      FARMER_REGISTRY_CONSENT_PURPOSE: ''
    envVarsFrom:
      AUTH_CLIENT_SECRET:
        secretKeyRef:
          name: '{{ tpl .Values.global.authClientSecret $ }}'
          key: '{{ tpl .Values.global.authClientSecretKey $ }}'
  partnerApi:
    image:
      repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/openg2p/livestock-registry/partner-api
      tag: bf78e69a5fd6@sha256:99c37673cb62b52476a408531ffb73fa92d8d06d5ba0e61ea8790d116297f785
    envVars:
      REGISTRY_PARTNER_API_VALIDATE_ATTRIBUTE_VALUES: 'true'
      REGISTRY_PARTNER_API_APPLICATION_REFERENCE_FORMAT: '{DATE:%Y%b%d|upper}-{SECONDS:5}{RAND:5}'
      ODK_HOOKS_ENABLED: 'true'
  celeryWorker:
    image:
      repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/openg2p/livestock-registry/celery
      tag: bf78e69a5fd6@sha256:982e8272993305d90d34ea5a449f915c5ad21689ba0788c48806fd003b1c143a
    envVars:
      CELERY_OPTS: worker -Q registry_worker_queue --loglevel=info --concurrency=4
      REGISTRY_CELERY_WORKERS_VALIDATE_ATTRIBUTE_VALUES: 'true'
      ODK_HOOKS_ENABLED: 'true'
      REGISTRY_CELERY_WORKERS_AWE_TOKEN_URL: '{{ tpl .Values.global.keycloakBaseUrl
        $ }}/realms/{{ tpl .Values.global.keycloakRealm $ }}/protocol/openid-connect/token'
      REGISTRY_CELERY_WORKERS_AWE_TOKEN_ISSUER_BASE_URL: '{{ tpl .Values.global.keycloakBaseUrl
        $ }}'
      REGISTRY_CELERY_WORKERS_AWE_CLIENT_ID: '{{ tpl .Values.global.authClientId $
        }}'
      REGISTRY_CELERY_WORKERS_AWE_ENABLED: '{{ .Values.global.aweEnabled }}'
      REGISTRY_CELERY_WORKERS_AWE_BASE_URL: '{{ tpl .Values.global.aweBaseUrl $ }}'
      REGISTRY_CELERY_WORKERS_AWE_HTTP_TIMEOUT_SECONDS: '{{ .Values.global.aweHttpTimeoutSeconds
        }}'
      REGISTRY_CELERY_WORKERS_AWE_DEFAULT_CALLBACK_URL: '{{ tpl .Values.global.aweDefaultCallbackUrl
        $ }}'
      REGISTRY_CELERY_WORKERS_AWE_CALLBACK_SECRET_ID: '{{ tpl .Values.global.aweCallbackSecretId
        $ }}'
    envVarsFrom:
      REGISTRY_CELERY_WORKERS_AWE_CLIENT_SECRET:
        secretKeyRef:
          name: '{{ tpl .Values.global.authClientSecret $ }}'
          key: '{{ tpl .Values.global.authClientSecretKey $ }}'
  celeryBeat:
    image:
      repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/openg2p/livestock-registry/celery
      tag: bf78e69a5fd6@sha256:982e8272993305d90d34ea5a449f915c5ad21689ba0788c48806fd003b1c143a
    envVars:
      CELERY_OPTS: worker --beat --loglevel=info --schedule=/tmp/celery-beat-schedule.db
        --concurrency=4
      ODK_HOOKS_ENABLED: 'true'
  dbSeed:
    image:
      repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/openg2p/livestock-registry/db-seed
      tag: bf78e69a5fd6@sha256:6ba640c81fc5a6eb19b4a81ae2b6b86ce78cd76dc64dc67723de26cffc5efae3
    loadGeoData: false
    loadSampleData: false
    loadImages: false
    loadTemplates: true
    envVars:
      APPROVER_RESOLVER_SECRET: livestock-approver-resolver-secret
  iamRegister:
    applicationDescription: Livestock Registry
  idgenerator:
    idGenerator:
      appConfig:
        idTypes:
          farmer:
            idLength: 10
          livestock:
            idLength: 12
          animal:
            idLength: 12
          land:
            idLength: 12
          cluster:
            idLength: 10
  staffUi:
    image:
      repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/openg2p/livestock-registry/staff-ui
      tag: bf78e69a5fd6@sha256:07905855fdbc7dd452e92a36d7076eaddc86c17cc7b339332bf6fe2b2ddf4166
  sanity:
    enabled: true
    image:
      repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/openg2p/livestock-registry/sanity-tests
      tag: bf78e69a5fd6@sha256:4bf827ba97d8af32315021bec0fad2d4910e53c3c0a1fa449aa37058d66ddcdc
    regType: Livestock
    regRecordType: spdci-extensions-dci:Livestock
    searchText: SANITY-LIVESTOCK-0001
    dataScopes: livestock_details
    deniedScopes: animal_details,health_event_details,vaccination_details,vital_event_details,breeding_details
    farmerRegisterId: 6b06a95a-9a6c-5a33-a33d-c1625716c59c
    crTabId: livestock_livestock_tab
    crSectionId: livestock_survey_personnel_section_02
reporting:
  db:
    host: ''
    port: 5432
    name: '{{ .Release.Name | replace "-" "_" }}'
    user: '{{ printf "%s_user" .Release.Name | replace "-" "_" }}'
    secret: '{{ .Release.Name }}'
    passwordKey: '{{ .Release.Name }}-db-user'
  masterData:
    host: ''
    port: 5432
    name: master_data
    user: master_data_user
    secret: master-data
    passwordKey: master-data-db-user
  image:
    repository: ''
    tag: ''
  views:
    enabled: false
    waitForSchemaSeconds: 600
    refreshSchedule: '*/30 * * * *'
    refreshLog:
      enabled: true
      retentionDays: 90
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
dashboardApi:
  enabled: false
  image:
    digest: sha256:f105a023e2cf38149ae194eefae91d9d9a9d8ab8c6839a5b8d8c3a2d40958ce9
    repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/openg2p/livestock-registry/dashboard-api
    tag: bf78e69a5fd6
  replicas: 1
  workers: 2
  dbPool:
    minSize: 1
    maxSize: 5
  allowedOrigins: []
  env: {}
  virtualService:
    enabled: false
    host: ''
    gateway: ''
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  imagePullSecrets: []
  envFrom: []
dashboardUi:
  enabled: false
  nameOverride: ''
  image:
    repository: ''
    tag: ''
    digest: ''
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  replicas: 1
  containerPort: 3000
  servicePort: 80
  env: []
  envFrom: []
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi
