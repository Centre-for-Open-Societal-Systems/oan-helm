{{- if .Values.connectorClientSecret.sync.enabled }}
# Lets the Commons client-secrets-sync Job write the Registry Connector client
# secret into this namespace as Secret {{ .Values.connectorClientSecret.secretName }}
# (key client_secret). A secretKeyRef cannot cross namespaces, so Commons copies
# it. Only that Secret may be read or changed; create cannot be limited by name
# in Kubernetes RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-connector-client-secret-sync
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.connectorClientSecret.secretName | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-connector-client-secret-sync
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-connector-client-secret-sync
subjects:
  - kind: ServiceAccount
    name: {{ .Values.connectorClientSecret.sync.serviceAccount | quote }}
    namespace: {{ .Values.connectorClientSecret.sync.namespace | quote }}
{{- end }}
