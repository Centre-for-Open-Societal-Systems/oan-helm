{{- /*
Chart-owned credentials Secret (secret.create). The values come from the delivery's
secret values file, never from Git; see the README.
*/ -}}
{{- if .Values.secret.create }}
{{- $values := .Values.secret.values | default dict }}
{{- $required := list "SPRING_DATASOURCE_USERNAME" "SPRING_DATASOURCE_PASSWORD" "ELASTICSEARCH_USERNAME" "ELASTICSEARCH_PASSWORD" "A2C_WEBHOOK_API_KEY" "A2C_WEBHOOK_API_SECRET" }}
{{- if .Values.redis.auth.enabled }}
{{- $required = append $required "SPRING_REDIS_PASSWORD" }}
{{- end }}
{{- range $key := $required }}
{{- if not (hasKey $values $key) }}
{{- fail (printf "secret.create: secret.values.%s is required (from the secret values file)" $key) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oan-leads-api.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oan-leads-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $values }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
