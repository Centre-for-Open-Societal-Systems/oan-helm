apiVersion: v2
appVersion: 2.3.4-rc.247
dependencies:
- name: websub
  version: 1.3.2
  repository: https://openg2p.github.io/openg2p-helm
  condition: websub.enabled
- alias: master-data
  condition: master-data.enabled
  name: openg2p-master-data
  repository: https://openg2p.github.io/openg2p-helm
  version: 0.0.0-develop.121
- alias: aggregation-api
  condition: aggregation-api.enabled
  name: oan-aggregation-api
  repository: https://raw.githubusercontent.com/Centre-for-Open-Societal-Systems/oan-helm/main/repository/develop
  version: 0.0.0-develop.20
- condition: artifactory.enabled
  name: artifactory
  repository: https://openg2p.github.io/openg2p-helm
  version: 12.0.3
- condition: keymanager.enabled
  name: keymanager
  repository: https://openg2p.github.io/openg2p-helm
  version: 12.1.1
- condition: superset.enabled
  name: superset
  repository: https://apache.github.io/superset
  version: 0.12.11
- condition: esignet.enabled
  name: esignet
  repository: https://openg2p.github.io/openg2p-helm
  version: 1.4.3
- condition: mock-identity-system.enabled
  name: mock-identity-system
  repository: https://openg2p.github.io/openg2p-helm
  version: 0.0.0-develop.9
- condition: odk-central.enabled
  name: odk-central
  repository: https://openg2p.github.io/openg2p-helm
  version: v2025.2.2
- condition: openg2p-iam-service.enabled
  name: openg2p-iam-service
  repository: https://openg2p.github.io/openg2p-helm
  version: 1.4.4-rc.125
- condition: openg2p-inji-certify.enabled
  name: openg2p-inji-certify
  repository: https://openg2p.github.io/openg2p-helm
  version: 0.0.0-develop.14
- condition: openg2p-audit-manager.enabled
  name: openg2p-audit-manager
  repository: https://openg2p.github.io/openg2p-helm
  version: 1.2.0
- condition: openg2p-staff-portal-ui.enabled
  name: openg2p-staff-portal-ui
  repository: https://openg2p.github.io/openg2p-helm
  version: 1.2.0
- condition: openg2p-awe.enabled
  name: openg2p-awe
  repository: https://openg2p.github.io/openg2p-helm
  version: 1.2.2
- condition: partner-management.enabled
  name: partner-management
  repository: https://openg2p.github.io/openg2p-helm
  version: 1.0.2
- condition: openg2p-consent-manager.enabled
  name: openg2p-consent-manager
  repository: https://openg2p.github.io/openg2p-helm
  version: 1.0.2
- condition: keycloak-init.enabled
  name: keycloak-init
  repository: https://openg2p.github.io/openg2p-helm
  version: 1.2.0
description: OAN Commons Services including OAN Consent Manager and Aggregation API
  from OAN repositories, with pinned OpenG2P shared-service dependencies.
