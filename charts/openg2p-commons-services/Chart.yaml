  oan.org/upstream-version: 2.3.4-rc.247
  oan.org/owner: OpenAgriNet (OAN)
  oan.org/consent-manager-source: https://github.com/Centre-for-Open-Societal-Systems/consent-management
  oan.org/aggregation-source: https://github.com/Centre-for-Open-Societal-Systems/oan-aggregation-api
