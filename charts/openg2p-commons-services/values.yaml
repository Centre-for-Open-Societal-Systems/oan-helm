websub:
  enabled: true
  existingSecret: commons-websub-encryption
  securityOn: false
  kafka:
    enabled: false
  kafkaInstallationName: '{{ tpl .Values.global.kafkaInstallationName $ }}'
  replicaCount: 1
  # Kafka auto-creation uses three partitions. Wait for explicit provisioning
  # before either WebSub process can create metadata topics with those defaults.
  initContainers: &websubTopicReadiness
  - name: wait-for-websub-topics
    image: docker.io/openg2p/kafka:3.7.1-debian-12-r4
    imagePullPolicy: IfNotPresent
    env:
    - name: KAFKA_HEAP_OPTS
      value: -Xmx256m -Xms128m
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    command: [/bin/bash, -ec]
    args:
    - |
      for topic in registered-websub-topics consolidated-websub-topics registered-websub-subscribers consolidated-websub-subscribers; do
        description=$(/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server commons-kafka:9092 --describe --topic "$topic")
        echo "$description" | grep -Eq 'PartitionCount: *1([[:space:]]|$)'
        echo "$description" | grep -Eq 'ReplicationFactor: *1([[:space:]]|$)'
      done
  istio:
    enabled: false
  consolidator:
    replicaCount: 1
    initContainers: *websubTopicReadiness
    istio:
      enabled: false
      virtualservice:
        enabled: false
websubTopicProvisioning:
  enabled: true
  image: docker.io/openg2p/kafka:3.7.1-debian-12-r4
  bootstrapServers: commons-kafka:9092
  topics:
  - registered-websub-topics
  - consolidated-websub-topics
  - registered-websub-subscribers
  - consolidated-websub-subscribers
