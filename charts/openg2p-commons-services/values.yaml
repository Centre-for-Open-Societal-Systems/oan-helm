odk-central:
  enabled: true
  hostname: '{{ tpl .Values.global.odkHostname $ }}'
  postgresqlInstallationName: '{{ tpl .Values.global.postgresqlHost $ }}'
  minioInstallationName: '{{ tpl .Values.global.minioInstallationName $ }}'
  mailInstallationName: '{{ tpl .Values.global.mailInstallationName $ }}'
  oidcClientId: openg2p-odk
  oidcClientSecret: '{{ tpl .Values.oidcClientId $ }}'
  oidcClientSecretKey: client_secret
  s3BlobsEnabled: true
  s3ServerUrl: http://{{ tpl .Values.global.minioInstallationName $ }}:9000
  odk-central-enketo:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
    envVars:
      REDIS_MAIN_HOST: '{{ tpl .Values.global.redisInstallationName $ }}-master'
      REDIS_CACHE_HOST: '{{ tpl .Values.global.redisInstallationName $ }}-master'
  pyxform:
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
  frontend:
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
  backend:
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
    initContainers:
    - name: wait-for-minio
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command:
      - sh
      - -c
      - "until nc -zv {{ tpl .Values.global.minioInstallationName $ }} 9000; do\n\
        \  echo \"Waiting for MinIO...\"\n  sleep 2\ndone\n"
    envVars:
      OIDC_ENABLED: true
      OIDC_ISSUER_URL: https://keycloak.development.oanstaging.com/realms/staff
      OIDC_CLIENT_ID: '{{ tpl .Values.oidcClientId $ }}'
    envVarsFrom:
      DB_PASSWORD:
        secretKeyRef:
          name: odk-db-user
          key: odk-db-user-password
      OIDC_CLIENT_SECRET:
        secretKeyRef:
          name: '{{ tpl .Values.oidcClientSecret $ }}'
          key: '{{ tpl .Values.oidcClientSecretKey $ }}'
  istio:
    virtualservice:
      gateway: istio-system/development
artifactory:
  enabled: true
  image:
    repository: mosipid/artifactory-server
    tag: 1.4.1-ES
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
keymanager:
  enabled: true
  hostname: keymanager.{{ tpl .Values.global.baseDomain $ }}
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
  authEnabled: false
  keystoreType: PKCS12
  p12KeystorePass: ''
  skipPostgresInitCheck: false
  skipKeygenCheck: true
  postgresqlInstallationName: '{{ tpl .Values.global.postgresqlHost $ }}'
  softhsmInstallationName: '{{ tpl .Values.global.softhsmInstallationName $ }}'
  artifactoryInstallationName: '{{ .Release.Name }}-artifactory'
  istio:
    enabled: false
    virtualservice:
      gateway: istio-system/development
  springConfig:
    names: application,kernel
    profile: default
    gitRepo:
      enabled: true
      repoUrl: https://github.com/openg2p/mosip-config
      branch: master
    rawConfig: ''
  envVars:
    JDK_JAVA_OPTIONS: -XX:-UseContainerSupport -Dspring.jmx.enabled=false -Dcom.sun.management.jmxremote=false
    auth_server_admin_allowed_audience: openg2p-registry,openg2p-registry-{{ .Release.Namespace
      }},openg2p-pbms,openg2p-pbms-{{ .Release.Namespace }},openg2p-spar,openg2p-spar-{{
      .Release.Namespace }},openg2p-g2p-bridge,openg2p-g2p-bridge-{{ .Release.Namespace
      }}
    keycloak_internal_url: '{{ tpl .Values.global.keycloakInternalUrl $ }}'
    keycloak_external_url: '{{ tpl .Values.global.keycloakBaseUrl $ }}'
  envVarsFrom:
    db_dbuser_password:
      secretKeyRef:
        name: keymgr-db-user
        key: keymgr-db-user-password
  postgresInit:
    enabled: true
    commonAnnotations:
      helm.sh/hook: null
      helm.sh/hook-weight: null
      helm.sh/hook-delete-policy: null
    envVars:
      DB_USER: keymgruser
    envVarsFrom:
      SU_USER_PWD:
        secretKeyRef:
          name: '{{ tpl .Values.global.postgresqlSecret $ }}'
          key: '{{ tpl .Values.global.postgresqlSecretKey $ }}'
      DBUSER_PWD:
        secretKeyRef:
          name: keymgr-db-user
          key: keymgr-db-user-password
  keygen:
    enabled: true
    commonAnnotations:
      helm.sh/hook: null
      helm.sh/hook-weight: null
      helm.sh/hook-delete-policy: null
    appIdsList:
    - OPENG2P_SR
    - OPENG2P_SR_NID
    - OPENG2P_SPAR
    - OPENG2P_SPAR_NID
    - OPENG2P_PBMS
    - OPENG2P_PBMS_NID
    - OPENG2P_BRIDGE
    - OPENG2P_BRIDGE_NID
    baseKeysList:
    - OPENG2P_SR:ENCRYPT
    - OPENG2P_SR_NID:ENCRYPT
    - OPENG2P_SPAR:ENCRYPT
    - OPENG2P_SPAR_NID:ENCRYPT
    - OPENG2P_PBMS:ENCRYPT
    - OPENG2P_PBMS_NID:ENCRYPT
    - OPENG2P_BRIDGE:ENCRYPT
    - OPENG2P_BRIDGE_NID:ENCRYPT
    envVars:
      JDK_JAVA_OPTIONS: -XX:-UseContainerSupport -Dspring.jmx.enabled=false -Dcom.sun.management.jmxremote=false
  persistence:
    enabled: true
superset:
  enabled: false
  hostname: '{{ tpl .Values.global.supersetHostname $ }}'
  oidcIssuerUrl: '{{ tpl .Values.global.keycloakIssuerUrl $ }}'
  oidcClientId: openg2p-superset
  supersetSecretKey: ''
  envFromSecrets:
  - openg2p-superset
  extraEnvRaw:
  - name: DB_PASS
    valueFrom:
      secretKeyRef:
        name: superset-db-user
        key: superset-db-user-password
  init:
    createAdmin: false
    jobAnnotations:
      helm.sh/hook: post-install,post-upgrade
      helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
  postgresql:
    enabled: false
  redis:
    enabled: false
  supersetNode:
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
    connections:
      redis_host: '{{ tpl .Values.global.redisInstallationName $ }}-master'
      db_host: '{{ tpl .Values.global.postgresqlHost $ }}'
      db_pass: ''
  supersetWorker:
    resources:
      requests:
        cpu: 50m
        memory: 768Mi
  bootstrapScript: '#!/bin/bash

    pip install authlib==1.3.0

    '
  configOverrides:
    enable_oauth: "import os\nSECRET_KEY = '{{ tpl .Values.supersetSecretKey $ }}'\
      \ or 'OPENG2P_SUPER_SECRET_KEY'\n\n# This will make sure the redirect_uri is\
      \ properly computed, even with SSL offloading\nENABLE_PROXY_FIX = True\n\nfrom\
      \ flask_appbuilder.security.manager import AUTH_OAUTH\nAUTH_TYPE = AUTH_OAUTH\n\
      OAUTH_PROVIDERS = [\n  {\n    \"name\": \"keycloak\",\n    \"icon\": \"fa-key\"\
      ,\n    \"token_key\": \"access_token\",\n    \"remote_app\": {\n      \"client_id\"\
      : \"{{ tpl .Values.oidcClientId $ }}\",\n      \"client_secret\": os.getenv(\"\
      client_secret\"),\n      \"api_base_url\": \"{{ tpl .Values.oidcIssuerUrl $\
      \ }}/protocol/openid-connect\",\n      \"client_kwargs\": {\"scope\": \"email\
      \ profile openid\"},\n      \"access_token_url\": \"{{ tpl .Values.oidcIssuerUrl\
      \ $ }}/protocol/openid-connect/token\",\n      \"jwks_uri\": \"{{ tpl .Values.oidcIssuerUrl\
      \ $ }}/protocol/openid-connect/certs\",\n      \"authorize_url\": \"{{ tpl .Values.global.keycloakExternalIssuerUrl\
      \ $ }}/protocol/openid-connect/auth\",\n      \"request_token_url\": None\n\
      \    },\n  }\n]\n\n# Map Authlib roles to superset roles\nAUTH_ROLES_MAPPING\
      \ = {\n  \"Public\": [\"Public\"],\n  \"Admin\": [\"Admin\"],\n}\n\nAUTH_ROLES_SYNC_AT_LOGIN\
      \ = True\n\n# Will allow user self registration, allowing to create Flask users\
      \ from Authorized User\nAUTH_USER_REGISTRATION = True\n\n# The default user\
      \ self registration role\n# AUTH_USER_REGISTRATION_ROLE = \"Public\"\n\nfrom\
      \ superset.security import SupersetSecurityManager\nclass CustomSsoSecurityManager(SupersetSecurityManager):\n\
      \  def oauth_user_info(self, provider, response=None):\n    if provider == \"\
      keycloak\":\n      me = self.appbuilder.sm.oauth_remotes[provider].get(\n  \
      \      \"openid-connect/userinfo\"\n      )\n      me.raise_for_status()\n \
      \     data = me.json()\n      return {\n        \"username\": data.get(\"preferred_username\"\
      , \"\"),\n        \"first_name\": data.get(\"given_name\", \"\"),\n        \"\
      last_name\": data.get(\"family_name\", \"\"),\n        \"email\": data.get(\"\
      email\", \"\"),\n        \"role_keys\": data.get(\"client_roles\", []),\n  \
      \    }\n    return {}\n\nCUSTOM_SECURITY_MANAGER = CustomSsoSecurityManager\n\
      SESSION_COOKIE_HTTPONLY = True\nSESSION_COOKIE_SECURE = True\nSESSION_COOKIE_SAMESITE\
      \ = None\nTALISMAN_ENABLED = False\n\n# Embedded dashboards. G2P Insights shows\
      \ Superset dashboards inside its\n# own shell, which loads /embedded/<uuid>\
      \ in an iframe \xE2\u20AC\u201D a route Superset\n# only registers when this\
      \ flag is on.\n#\n# Without it the failure is silent in an unhelpful way: the\
      \ REST call that\n# mints an embedded UUID still succeeds, the guest token is\
      \ still issued\n# and looks valid, so every check passes and only the iframe\
      \ 404s. It reads\n# as a broken client, not a missing feature flag.\nFEATURE_FLAGS\
      \ = {\"EMBEDDED_SUPERSET\": True}\n\n# The role a guest token carries. Gamma\
      \ can read the dashboards it is\n# granted and nothing else, which is what an\
      \ embedded viewer needs.\nGUEST_ROLE_NAME = \"Gamma\"\n"
  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: ''
      gateway: istio-system/development
      destination: '{{ include "superset.fullname" . }}'
      destinationPort: '{{ .Values.service.port }}'
    gateway:
      enabled: false
      host: ''
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: true
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ''
