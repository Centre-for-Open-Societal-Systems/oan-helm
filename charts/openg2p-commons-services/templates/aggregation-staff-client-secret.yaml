{{- define "oan.hookFile.aggregation-staff-client-secret" -}}
{{- /*
  After every install and upgrade, give the Aggregation API the aggregation-layer-staff client secret
  that Keycloak holds once this release's keycloak-init and client-secrets-sync Jobs have finished
  (files/aggregation-staff-client-secret.py): it is written into the API's runtime Secret and into the
  client's own Secret, and the API is restarted when its secret changed. Needed because keycloak-init
  sets an existing client's secret to the Secret it renders, while the API reads its runtime Secret.
  The role reaches only those two Secrets and the one Deployment.
*/ -}}
{{- $c := .Values.aggregationStaffClientSecret -}}
{{- $init := index .Values "keycloak-init" | default dict -}}
{{- if and $c.enabled $init.enabled (index .Values "aggregation-api" "enabled") }}
{{- $declared := false -}}
{{- range $realm, $def := ($init.realms | default dict) }}
{{- range ($def.clients | default list) }}
{{- if and (eq $realm $c.realm) (eq .clientId $c.clientId) (not .publicClient) }}{{ $declared = true }}{{ end }}
{{- end }}
{{- end }}
{{- if not $declared }}
{{- fail (printf "aggregationStaffClientSecret: %s/%s is not a confidential client in keycloak-init.realms" $c.realm $c.clientId) }}
{{- end }}
{{- $runtime := required "aggregation-api.runtimeSecret is required" (index .Values "aggregation-api" "runtimeSecret") -}}
{{- $name := printf "%s-aggregation-staff-client-secret" .Release.Name -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: aggregation-staff-client-secret
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: aggregation-staff-client-secret
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $c.clientId | quote }}, {{ $runtime | quote }}]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ tpl $c.deployment $ | quote }}]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: aggregation-staff-client-secret
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: aggregation-staff-client-secret
data:
  sync.py: |
{{ .Files.Get "files/aggregation-staff-client-secret.py" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: aggregation-staff-client-secret
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "40"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- /* sha256 of the live client and runtime Secrets (never their values): a deleted or replaced Secret
           changes this hook's inputs, so it runs again (templates/_hook_stamps.tpl). */}}
    oan.org/secrets-sha256: {{ printf "%s|%s" (toJson ((lookup "v1" "Secret" .Release.Namespace $c.clientId).data | default dict)) (toJson ((lookup "v1" "Secret" .Release.Namespace $runtime).data | default dict)) | sha256sum | quote }}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1500
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      {{- with $c.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: sync
          image: {{ $c.image | quote }}
          command: [python, -B, /job/sync.py]
          env:
            - { name: KEYCLOAK_URL, value: {{ tpl $c.keycloak.url $ | quote }} }
            - { name: KEYCLOAK_USER, value: {{ $c.keycloak.user | quote }} }
            - name: KEYCLOAK_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ tpl $c.keycloak.existingSecret $ | quote }}, key: {{ $c.keycloak.existingSecretKey | quote }} } }
            - { name: REALM, value: {{ $c.realm | quote }} }
            - { name: CLIENT_ID, value: {{ $c.clientId | quote }} }
            - { name: NAMESPACE, value: {{ .Release.Namespace | quote }} }
            - { name: RELEASE, value: {{ .Release.Name | quote }} }
            - { name: REVISION, value: {{ .Release.Revision | quote }} }  # oan-hook-volatile
            - { name: SYNC_JOB, value: {{ printf "%s-client-secrets-sync-%s" .Release.Name (include "oan.clientSecretsSync.suffix" .) | quote }} }
            - { name: RUNTIME_SECRET, value: {{ $runtime | quote }} }
            - { name: RUNTIME_KEY, value: {{ $c.runtimeKey | quote }} }
            - { name: DEPLOYMENT, value: {{ tpl $c.deployment $ | quote }} }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: job, mountPath: /job, readOnly: true }
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
      volumes:
        - name: job
          configMap:
            name: {{ $name }}
            items:
              - { key: sync.py, path: sync.py }
{{- end }}
{{- end -}}
{{- /* Hook documents render only when their inputs changed (templates/_hook_stamps.tpl). */ -}}
{{ include "oan.hook.file" (list . "aggregation-staff-client-secret") }}
