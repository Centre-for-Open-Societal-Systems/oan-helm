{{- $component := .Values.aggregationApi -}}
{{- if $component.enabled }}
{{- $name := $component.nameOverride | default (printf "%s-aggregation-api" .Release.Name) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: aggregation-api
spec:
  replicas: {{ $component.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: aggregation-api
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: aggregation-api
    spec:
      automountServiceAccountToken: false
      {{- with $component.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: aggregation-api
          image: {{ include "coss.image" $component.image | quote }}
          imagePullPolicy: {{ $component.image.pullPolicy }}
          {{- with $component.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $component.containerPort }}
          {{- with $component.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $component.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $component.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /ping
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
      {{- with $component.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: aggregation-api
  ports:
    - name: http
      port: {{ $component.servicePort }}
      targetPort: http
{{- if $component.virtualService.enabled }}
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
spec:
  hosts:
    - {{ required "aggregationApi.virtualService.host is required" $component.virtualService.host | quote }}
  gateways:
    - {{ required "aggregationApi.virtualService.gateway is required" $component.virtualService.gateway | quote }}
  http:
    - route:
        - destination:
            host: {{ $name }}
            port:
              number: {{ $component.servicePort }}
{{- end }}
{{- end }}
