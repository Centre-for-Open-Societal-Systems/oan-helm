{{- /* Named by the sha256 of its own spec: unchanged inputs keep the finished Job, so nothing runs again,
     and a change gets a new name (a Job's spec.template is immutable). No TTL: the finished Job is the record. */ -}}
{{- define "oan.plainJob.websub-topics" -}}
{{- $root := index . 0 -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $root.Release.Name }}-websub-topics-{{ index . 1 }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/managed-by: {{ $root.Release.Service }}
    oan.org/purpose: websub-topic-provisioning
    oan.org/inputs-hash: {{ index . 1 | quote }}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        oan.org/purpose: websub-topic-provisioning
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: provision
          image: {{ $root.Values.websubTopicProvisioning.image | quote }}
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: BOOTSTRAP_SERVERS
              value: {{ required "websubTopicProvisioning.bootstrapServers is required" $root.Values.websubTopicProvisioning.bootstrapServers | quote }}
            - name: KAFKA_HEAP_OPTS
              value: -Xmx256m -Xms128m
          command: [/bin/bash, -ec]
          args:
            - |
              export PATH="/opt/bitnami/kafka/bin:$PATH"
              {{- range $root.Values.websubTopicProvisioning.topics }}
              topic={{ . | quote }}
              kafka-topics.sh --bootstrap-server "$BOOTSTRAP_SERVERS" --create --if-not-exists \
                --topic "$topic" --partitions 1 --replication-factor 1 \
                --config retention.ms=-1 --config retention.bytes=-1
              description=$(kafka-topics.sh --bootstrap-server "$BOOTSTRAP_SERVERS" --describe --topic "$topic")
              echo "$description" | grep -Eq 'PartitionCount: *1([[:space:]]|$)'
              echo "$description" | grep -Eq 'ReplicationFactor: *1([[:space:]]|$)'
              kafka-configs.sh --bootstrap-server "$BOOTSTRAP_SERVERS" --entity-type topics \
                --entity-name "$topic" --alter --add-config retention.ms=-1,retention.bytes=-1
              {{- end }}
{{- end -}}
{{- if and .Values.websub.enabled .Values.websubTopicProvisioning.enabled }}
{{- $hash := include "oan.plainJob.websub-topics" (list . "") | sha256sum | trunc 8 }}
{{ include "oan.plainJob.websub-topics" (list . $hash) }}
{{- end }}
