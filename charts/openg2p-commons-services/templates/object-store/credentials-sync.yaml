{{- /* Copies Secret commons-minio (the Garage keys, written by the base chart's init Job) into the registry namespaces,
     where the registries read it. Replaces hand-applied copies. Server-side apply adopts them; keys the copy already
     has and this does not set are left alone. Runs after every install and upgrade, so a key rotation reaches the
     registries on the next Commons delivery (the registries pick it up when their pods restart). */ -}}
{{- $o := .Values.objectStore | default dict }}
{{- if and $o.enabled $o.credentialsSync.enabled }}
{{- $name := printf "%s-object-store-credentials" .Release.Name }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["commons-minio"]
  verbs: ["get"]
{{- range $ns := $o.credentialsSync.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["commons-minio"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
- kind: ServiceAccount
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
- kind: ServiceAccount
  name: {{ $name }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: OnFailure
      containers:
      - name: sync
        image: {{ $o.credentialsSync.image | quote }}
        env:
        - name: NAMESPACES
          value: {{ join " " $o.credentialsSync.namespaces | quote }}
        command: ["/bin/sh", "-c", "apk add --no-cache curl jq > /dev/null 2>&1 && sh /scripts/sync.sh"]
        volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
      volumes:
      - name: scripts
        configMap:
          name: {{ $name }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  sync.sh: |
    set -eu
    API=https://kubernetes.default.svc
    SA=/var/run/secrets/kubernetes.io/serviceaccount
    TOKEN=$(cat $SA/token)
    NS_SRC=$(cat $SA/namespace)
    call() { curl -sS --cacert $SA/ca.crt -H "Authorization: Bearer $TOKEN" "$@"; }
    data=$(call -f "$API/api/v1/namespaces/$NS_SRC/secrets/commons-minio" | jq -c '.data')
    for key in root-user root-password readonly-user readonly-password; do
      [ "$(echo "$data" | jq -r --arg k "$key" '.[$k] // empty')" ] || { echo "commons-minio has no $key" >&2; exit 1; }
    done
    for ns in $NAMESPACES; do
      body=$(jq -n --arg ns "$ns" --argjson d "$data" '{apiVersion:"v1",kind:"Secret",type:"Opaque",
        metadata:{name:"commons-minio",namespace:$ns,labels:{"app.kubernetes.io/managed-by":"commons-services"}},data:$d}')
      call -f -X PATCH -H "Content-Type: application/apply-patch+yaml" --data "$body" \
        "$API/api/v1/namespaces/$ns/secrets/commons-minio?fieldManager=commons-services-object-store&force=true" > /dev/null
      echo "commons-minio synced to $ns"
    done
{{- end }}
