{{- $portal := .Values.consentPartnerPortal -}}
{{- if $portal.enabled }}
{{- if not (index .Values "openg2p-consent-manager" "enabled") }}
{{- fail "consentPartnerPortal requires openg2p-consent-manager.enabled" }}
{{- end }}
{{- $name := $portal.nameOverride | default (printf "%s-cm-partner-portal" .Release.Name) -}}
{{- $api := $portal.staffApiServiceName | default (printf "%s-cm-api" .Release.Name) -}}
{{- $config := dict "apiBaseUrl" $portal.apiBaseUrl "compositeUrl" $portal.compositeUrl "keycloak" (dict "url" (required "partner portal requires a public Keycloak URL" $portal.keycloak.url) "realm" $portal.keycloak.realm "clientId" $portal.keycloak.clientId) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: consent-manager-partner-portal
data:
  config.json: {{ $config | toJson | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    org.opencontainers.image.source: https://github.com/Centre-for-Open-Societal-Systems/consent-management
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: consent-manager-partner-portal
    app.kubernetes.io/part-of: oan
spec:
  replicas: {{ $portal.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: consent-manager-partner-portal
  template:
    metadata:
      annotations:
        checksum/portal-config: {{ $config | toJson | sha256sum }}
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: consent-manager-partner-portal
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      {{- with $portal.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: consent-partner-portal
          image: {{ include "coss.image" $portal.image | quote }}
          imagePullPolicy: {{ $portal.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          resources:
            {{- toYaml $portal.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
            failureThreshold: 20
          readinessProbe:
            httpGet: {path: /, port: http}
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 20
          volumeMounts:
            - name: runtime-config
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
              readOnly: true
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: runtime-config
          configMap:
            name: {{ $name }}-config
        - name: nginx-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: consent-manager-partner-portal
{{- if $portal.virtualService.enabled }}
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
spec:
  hosts:
    - {{ required "partner portal requires virtualService.host" $portal.virtualService.host | quote }}
  gateways:
    - {{ $portal.virtualService.gateway | quote }}
  http:
    - name: partner-portal-api
      match:
        - uri:
            prefix: /consent/v1/partner-portal/
      headers:
        request:
          set:
            x-forwarded-host: {{ $portal.virtualService.host | quote }}
            x-forwarded-proto: https
      route:
        - destination:
            host: {{ $api }}
            port: {number: 80}
    - name: partner-portal-ui
      match:
        - uri: {prefix: /}
      route:
        - destination:
            host: {{ $name }}
            port: {number: 80}
{{- end }}
{{- end }}
