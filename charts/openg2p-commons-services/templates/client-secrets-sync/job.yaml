{{- /* Named by the sha256 of its own spec and its script: unchanged inputs keep the finished Job, so nothing runs again,
     and a change gets a new name (a Job's spec.template is immutable). No TTL: the finished Job is the record. */ -}}
{{- define "oan.plainJob.client-secrets-sync" -}}
{{- $root := index . 0 -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $root.Release.Name }}-client-secrets-sync-{{ index . 1 }}
  labels:
    oan.org/inputs-hash: {{ index . 1 | quote }}
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: {{ $root.Release.Name }}-client-secrets-sync
      restartPolicy: OnFailure
      containers:
        - name: sync
          image: "docker.io/alpine:3.20"
          command: ["/bin/sh", "-c", "apk add --no-cache curl jq > /dev/null 2>&1 && sh /scripts/sync.sh"]
          env:
            - name: KEYCLOAK_URL
              value: {{ tpl $root.Values.global.keycloakInternalUrl $root | quote }}
            - name: KEYCLOAK_USER
              value: {{ index $root.Values "keycloak-init" "keycloak" "user" | quote }}
            - name: KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ tpl (index $root.Values "keycloak-init" "keycloak" "existingSecret") $root }}
                  key: {{ index $root.Values "keycloak-init" "keycloak" "existingSecretKey" }}
            - name: NAMESPACE
              value: {{ $root.Release.Namespace | quote }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: {{ $root.Release.Name }}-client-secrets-sync
{{- end -}}
{{- /* The suffix of this release's client-secrets-sync Job; aggregation-staff-client-secret waits for that Job. */ -}}
{{- define "oan.clientSecretsSync.suffix" -}}
{{- printf "%s%s" (include "oan.plainJob.client-secrets-sync" (list . "")) (include (print .Template.BasePath "/client-secrets-sync/configmap.yaml") .) | sha256sum | trunc 8 -}}
{{- end -}}
{{- if (index .Values "keycloak-init" "enabled") }}
{{ include "oan.plainJob.client-secrets-sync" (list . (include "oan.clientSecretsSync.suffix" .)) }}
{{- end }}
