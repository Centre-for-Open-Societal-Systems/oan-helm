{{- /*
The Admin API keys the gateway and its Ingress Controller read from the Secret named by
apisix.apisix.admin.credentials.secretName. Generated once with random values and kept across
upgrades and uninstall (resource-policy keep), so the Admin API key never changes by itself.
A Secret of that name made by hand is left alone: set adminCredentials.create to false, or create it
before the first install and this template steps aside.
*/ -}}
{{- if .Values.adminCredentials.create }}
{{- $name := .Values.apisix.apisix.admin.credentials.secretName }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $owned := false }}
{{- if $existing }}
{{- $owned = eq (index ($existing.metadata.annotations | default dict) "meta.helm.sh/release-name" | default "") .Release.Name }}
{{- end }}
{{- if or (not $existing) $owned }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  admin: {{ if $existing }}{{ index $existing.data "admin" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
  viewer: {{ if $existing }}{{ index $existing.data "viewer" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
{{- end }}
{{- end }}
