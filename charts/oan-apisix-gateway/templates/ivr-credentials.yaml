{{- /*
The two Secrets of the telco IVR vendor flow, in the gateway namespace:

  oan-ivr-vendor                       key `key`            the vendor's apikey, read by the oan-ivr-vendor
                                                            ApisixConsumer (extraDeploy). Generated once, kept
                                                            across upgrades. Give it to the vendor.
  oan-grievance-ivr-frappe-credential  key `authorization`  `token <api_key>:<api_secret>` that the grievance route
                                                            sends to Frappe. Copied from the Secret of the same
                                                            name in ivrCredentials.grievanceNamespace, which the
                                                            grievance release generates and applies to the Frappe
                                                            user. Install the grievance release first.

The copy uses lookup, so it works while both releases run in one cluster. With the gateway in
another cluster, set ivrCredentials.frappeCredential.create to false and sync the Secret with
External Secrets instead. helm template and --dry-run cannot see the cluster and render an
empty credential.
*/ -}}
{{- if .Values.ivrCredentials.vendorKey.create }}
{{- $name := .Values.ivrCredentials.vendorKey.name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $owned := false }}
{{- if $existing }}
{{- $owned = eq (index ($existing.metadata.annotations | default dict) "meta.helm.sh/release-name" | default "") .Release.Name }}
{{- end }}
{{- if or (not $existing) $owned }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  key: {{ if $existing }}{{ index $existing.data "key" }}{{ else }}{{ randAlphaNum 40 | b64enc }}{{ end }}
---
{{- end }}
{{- end }}
{{- if .Values.ivrCredentials.frappeCredential.create }}
{{- $name := .Values.ivrCredentials.frappeCredential.name }}
{{- $source := lookup "v1" "Secret" .Values.ivrCredentials.frappeCredential.sourceNamespace $name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $owned := false }}
{{- if $existing }}
{{- $owned = eq (index ($existing.metadata.annotations | default dict) "meta.helm.sh/release-name" | default "") .Release.Name }}
{{- end }}
{{- if and $source $source.data (hasKey $source.data "authorization") (or (not $existing) $owned) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  authorization: {{ index $source.data "authorization" }}
{{- end }}
{{- end }}
