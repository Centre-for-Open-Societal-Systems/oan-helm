{{- /*
The Secret of the A2C partner routes, in the gateway namespace:

  a2c-frappe-service-credential  key `authorization`  `token <api_key>:<api_secret>` that the partner routes
                                                      (consent data, lead intake) send to Frappe. Copied from
                                                      the Secret of the same name in a2cCredentials.sourceNamespace,
                                                      which the A2C release generates and applies to the
                                                      A2C Partner Service user. Install the A2C release first.

The copy uses lookup, so it works while both releases run in one cluster. With the gateway in
another cluster, set a2cCredentials.frappeCredential.create to false and sync the Secret with
External Secrets instead. helm template and --dry-run cannot see the cluster and render an
empty credential. APISIX reads it from its environment, so restart it after the first copy.
*/ -}}
{{- if .Values.a2cCredentials.frappeCredential.create }}
{{- $name := .Values.a2cCredentials.frappeCredential.name }}
{{- $source := lookup "v1" "Secret" .Values.a2cCredentials.frappeCredential.sourceNamespace $name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $owned := false }}
{{- if $existing }}
{{- $owned = eq (index ($existing.metadata.annotations | default dict) "meta.helm.sh/release-name" | default "") .Release.Name }}
{{- end }}
{{- if and $source $source.data (hasKey $source.data "authorization") (or (not $existing) $owned) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  authorization: {{ index $source.data "authorization" }}
{{- end }}
{{- end }}
