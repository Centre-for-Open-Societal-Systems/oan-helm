{{- if .Values.grafanaDatasource.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-grafana-datasource
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oan-loki.labels" . | nindent 4 }}
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: {{ .Values.grafanaDatasource.name }}
        uid: loki
        type: loki
        access: proxy
        url: {{ include "oan-loki.url" . }}
        isDefault: {{ .Values.grafanaDatasource.isDefault }}
        jsonData:
          maxLines: {{ .Values.grafanaDatasource.maxLines }}
{{- end }}
