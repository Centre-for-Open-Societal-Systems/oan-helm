# Defaults: one Loki pod (monolithic), chunks on a PersistentVolume, 14-day retention.
# For S3 and 3 replicas, add -f values-s3.yaml.

# --- Added by this chart -----------------------------------------------------
grafanaDatasource:
  # ConfigMap picked up by the Grafana sidecar (label grafana_datasource=1).
  enabled: true
  name: Loki
  isDefault: true
  # Defaults to the Loki gateway service in this release's namespace.
  url: ""
  maxLines: 5000

# --- Upstream chart: grafana-community/loki 21.0.0 ----------------------------
loki:
  fullnameOverride: loki
  deploymentMode: Monolithic

  loki:
    # Pinned by digest (multi-arch index of grafana/loki:3.7.9).
    image:
      tag: 3.7.9
      digest: sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    # Single tenant: agents push without an X-Scope-OrgID header.
    auth_enabled: false
    commonConfig:
      replication_factor: 1
      path_prefix: /var/loki
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    compactor:
      retention_enabled: true
      delete_request_store: filesystem
      working_directory: /var/loki/compactor
    limits_config:
      retention_period: 336h          # 14 days
      allow_structured_metadata: true # OTLP resource attributes
      volume_enabled: true
      ingestion_rate_mb: 16
      ingestion_burst_size_mb: 32
      max_query_lookback: 336h
    pattern_ingester:
      enabled: true
    rulerConfig:
      enable_api: true
      storage:
        type: local
        local:
          directory: /var/loki/rules

  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 50Gi
      storageClass: null   # cluster default
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 4Gi

  gateway:
    enabled: true
    image:
      tag: 1.31-alpine
      digest: sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
    service:
      type: ClusterIP
    # The access-log exporter sidecar only feeds Prometheus, which this stack does not run.
    metrics:
      enabled: false

  # Rules are not loaded from ConfigMaps; drop the k8s-sidecar container.
  sidecar:
    rules:
      enabled: false

  # Memcached caches are sized for production clusters; not needed at this scale.
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

  # Self-test components the docs leave on by default.
  lokiCanary:
    enabled: false
  test:
    enabled: false

  # Monolithic: every other component stays at zero.
  backend: {replicas: 0}
  read: {replicas: 0}
  write: {replicas: 0}
  ingester: {replicas: 0}
  querier: {replicas: 0}
  queryFrontend: {replicas: 0}
  queryScheduler: {replicas: 0}
  distributor: {replicas: 0}
  compactor: {replicas: 0}
  indexGateway: {replicas: 0}
  bloomPlanner: {replicas: 0}
  bloomBuilder: {replicas: 0}
  bloomGateway: {replicas: 0}
