{{- $name := required "serviceAccount.name is required" .Values.serviceAccount.name }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
---
# Long-lived token the Jenkins kubeconfig carries. Deleting the Secret revokes it.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-token
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/service-account.name: {{ $name }}
type: kubernetes.io/service-account-token
