name: Publish Helm repository
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: helm-pages
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - run: python -m pip install -r requirements.txt
      - name: Verify publication readiness and all chart packages
        run: python scripts/validate.py --package --release-ready
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
