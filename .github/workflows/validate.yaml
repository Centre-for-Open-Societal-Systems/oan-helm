name: Validate Helm charts
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  protected-paths:
    # repository/, the archive seals, current.yaml and CHANGELOG.md are written
    # only by release.yaml after merge; Rancher reads repository/ directly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Reject hand-made changes to release outputs
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch -q origin "$BASE_REF"
            python scripts/check_protected_paths.py --base "origin/$BASE_REF"
          elif [[ "$GITHUB_REF_NAME" == "main" && -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            python scripts/check_protected_paths.py --range "$BEFORE..$GITHUB_SHA"
          fi
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v5
        with:
          version: v3.19.0
      - run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate sources, locks, workload options and packaged repository
        # A chart changed without a version bump passes as "unreleased";
        # release.yaml versions and publishes it after merge.
        run: |
          python scripts/validate.py --package
          python scripts/validate_registry_addons.py --package
      - name: Retain validation evidence
        uses: actions/upload-artifact@v7
        with:
          name: helm-validation
          path: releases/validation.json
