name: Validate Helm charts
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - run: python -m pip install -r requirements.txt
      - name: Verify URL migration preserves private routes and configuration
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate sources, locks, workload options and packaged repository
        run: |
          args=(--package)
          if [[ "$GITHUB_REF_NAME" != "develop-refactor" ]]; then
            args+=(--release-ready)
          fi
          python scripts/validate.py "${args[@]}"
          python scripts/validate_registry_addons.py --package
      - name: Retain validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: helm-validation
          path: releases/validation.json
