name: Release Helm charts
# After a merge to main, give every changed chart its next version, package it,
# update the Helm index, SHA256SUMS and CHANGELOG.md, and commit the result.
on:
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - 'addons/registry-dashboards/**'
      - 'releases/retired.txt'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  # One release at a time; a queued run picks up whatever the previous one missed.
  group: release-helm-charts
  cancel-in-progress: false
jobs:
  release:
    # Release commits are pushed with GITHUB_TOKEN and trigger no workflow;
    # the guard also covers a token change later.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # Changelog ranges and the seals of older archives come from history.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v5
        with:
          version: v3.19.0
      - run: python -m pip install -r requirements.txt
      - name: Version and package changed charts
        run: python scripts/release.py
      - name: Validate the released repository
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          python scripts/validate.py --package
          python scripts/validate_registry_addons.py --package
      - name: Point New Dev at the released Commons services chart
        # New Dev follows environments/dev/commons-services.chart. Moving it here, in the
        # release commit, replaces the second pull request that only edited that file.
        # It moves forward only, and only to a chart whose archive is in repository/ and
        # SHA256SUMS. Staging is promoted by hand.
        run: python scripts/ci/pin_dev_chart.py
      - name: Commit and tag the release
        run: |
          if [[ ! -s .build/release-message.txt ]] && git diff --quiet -- releases/artifacts.json environments/dev/commons-services.chart; then
            echo "Nothing to release."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A CHANGELOG.md charts addons repository releases environments/dev/commons-services.chart
          if [[ -s .build/release-message.txt ]]; then
            git commit -q -F .build/release-message.txt
          elif ! git diff --cached --quiet -- environments/dev/commons-services.chart; then
            git commit -q -m "chore(release): point New Dev at commons-services $(tr -d '[:space:]' < environments/dev/commons-services.chart)"
          else
            git commit -q -m 'chore(release): seal archives published before source fingerprints'
          fi
          while read -r tag; do git tag "$tag"; done < <(cat .build/release-tags.txt 2>/dev/null || true)
          # A merge that landed meanwhile is released by the queued run.
          git push origin HEAD:main
          if [[ -s .build/release-tags.txt ]]; then
            git push origin $(cat .build/release-tags.txt)
            { echo '### Released'; echo; tail -n +3 .build/release-message.txt; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: helm-release-validation
          path: |
            releases/validation.json
            releases/registry-addon-validation.json
          if-no-files-found: ignore
