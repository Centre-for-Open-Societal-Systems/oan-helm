name: Index published charts
# Registry pipelines add one archive to repository/<channel>/ (scripts/ci/publish_chart.py).
# This workflow alone writes the index, checksums, seals, history and CHANGELOG.md, so pipelines of
# different registries never conflict.
on:
  push:
    branches: [main]
    paths:
      - 'repository/develop/**'
      - 'repository/staging/**'
      - 'repository/release/**'
      - 'scripts/publish_channels.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  # Shares its group with the chart release: both write CHANGELOG.md and push to main.
  group: release-helm-charts
  cancel-in-progress: false
jobs:
  index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v5
        with:
          version: v3.19.0
      - run: python -m pip install -r requirements.txt
      - name: Index and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # A pipeline can add an archive while this runs: start again from the new main.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python scripts/publish_channels.py
            git add -A CHANGELOG.md repository releases
            if git diff --cached --quiet; then
              echo "Nothing to index."
              exit 0
            fi
            git commit -q -m 'chore(release): index published charts'
            if git push -q origin HEAD:main; then
              while read -r tag; do
                git tag "$tag" && git push -q origin "$tag"
              done < .build/channel-tags.txt
              exit 0
            fi
          done
          echo "main kept moving; the next published archive runs this again." >&2
          exit 1
